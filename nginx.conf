server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML 禁止缓存，避免移动端仍命中旧版（含 Caizhi 裸引用）页面
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    location /js/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 前端 /api 代理：知识库
    location /api/knowledge/ {
        proxy_pass https://agent.unidt.com/v1/knowledge/;
        proxy_ssl_server_name on;
        proxy_set_header Host agent.unidt.com;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }

    # 前端 /api 代理：大模型兼容接口
    location /api/llm/ {
        proxy_pass https://ai-api.unidtai.com/openapi/llm/compatible-mode/v1/;
        proxy_ssl_server_name on;
        proxy_set_header Host ai-api.unidtai.com;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/health {
        default_type application/json;
        return 200 '{"ok":true,"service":"caizhi-web"}';
    }
}
