services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "${DEPLOY_PORT:-8080}:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  api:
    image: nginx:1.27-alpine
    ports:
      - "${DEPLOY_API_PORT:-8081}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/usr/share/nginx/html:ro
    restart: unless-stopped
