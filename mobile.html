  var WEEKDAY_CHAR = { 日: 0, 天: 0, 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6 };

  function pad2(n) { return String(n).padStart(2, "0"); }
  function formatTripDate(d) {
    var wd = WEEKDAY_LABEL[d.getDay()] || "";
    return pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + "（周" + wd + "）";
  }
  function startOfWeekMonday(base) {
    var d = new Date(base); d.setHours(12, 0, 0, 0);
    var day = d.getDay(); var diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff); return d;
  }
  function dateOnWeek(monday, weekday) {
    var d = new Date(monday);
    var add = weekday === 0 ? 6 : weekday - 1;
    d.setDate(monday.getDate() + add); return d;
  }
  function resolveWeekdayToken(token, baseDate) {
    var m = String(token || "").match(/(下|本)?周([一二三四五六日天])/);
    if (!m) return null;
    var prefix = m[1] || ""; var weekday = WEEKDAY_CHAR[m[2]];
    if (weekday == null) return null;
    var base = new Date(baseDate || Date.now()); base.setHours(12, 0, 0, 0);
    var monday = startOfWeekMonday(base);
    if (prefix === "下") { monday = new Date(monday); monday.setDate(monday.getDate() + 7); }
    else if (!prefix) {
      var candidate = dateOnWeek(monday, weekday);
      if (candidate.getTime() < base.getTime() - 12 * 3600 * 1000) {
        monday = new Date(monday); monday.setDate(monday.getDate() + 7);
      }
    }
    return dateOnWeek(monday, weekday);
  }
  function extractTripReason(text) {
    if (/设备检|检修/.test(text)) return "设备检修";
    var m = text.match(/对接([^，,。；;\s]+)/);
    if (m) {
      if (/设备检|检修/.test(m[1])) return "设备检修";
      return m[1];
    }
    if (/会议|开会|拜访|培训|验收|调研|参观/.test(text)) {
      var m2 = text.match(/(会议|开会|拜访|培训|验收|调研|参观)[^，,。；;\s]*/);
      if (m2) return m2[0];
    }
    return "出差对接";
  }
  function extractTripDestination(text) {
    var q = String(text || "").trim();
    if (!q) return "";
    var m = q.match(/(?:上周|本周|上星期|这周|下星期)([\u4e00-\u9fa5]{2,4})出差/);
    if (m) return m[1].replace(/市$/, "");
    m = q.match(/去([\u4e00-\u9fa5A-Za-z0-9]{2,12}?)(?:市)?(?=对接|开会|参观|出差|洽谈|培训|调研|办理|参加|处理|进行|订|回|返回|，|,|、|。|；|;|的|和|与|跟|[\s])/);
    if (m) return m[1].replace(/市$/, "");
    m = q.match(/去([\u4e00-\u9fa5]{2,8})市/);
    if (m) return m[1];
    m = q.match(/(?:到|赴|前往)([\u4e00-\u9fa5]{2,8})/);
    if (m) return m[1].replace(/(?:对接|开会|参观|出差).*$/, "").replace(/市$/, "");
    m = q.match(/([\u4e00-\u9fa5]{2,4})出差/);
    if (m) {
      var city = m[1].replace(/市$/, "");
      city = city.replace(/^(?:把|去|到|赴|往)/, "");
      city = city.replace(/^[上下本这]?周/, "");
      if (city.length > 3) city = city.slice(-2);
      if (city.length >= 2) return city;
    }
    m = q.match(/去([\u4e00-\u9fa5A-Za-z0-9]{2,12})/);
    if (m) {
      return (m[1]
        .replace(/(?:对接|开会|参观|出差|洽谈|培训|调研|办理|参加).*$/, "")
        .replace(/[，,、。；;].*$/, "")
        .replace(/市$/, "") || m[1]).trim();
    }
    return "";
  }
  function parseTripAssistIntent(question) {
    var q = String(question || "").trim();
    if (!q) return null;
    var destination = extractTripDestination(q);
    if (!destination || !/周[一二三四五六日天]/.test(q)) return null;
    if (!/(回|返回|返程|回来)/.test(q) && !(/周[一二三四五六日天].*周[一二三四五六日天]/.test(q))) return null;
    var startTokenMatch = q.match(/(下|本)?周[一二三四五六日天]/);
    var endTokenMatch = q.match(/(?:，|,|。|、)?(?:于)?((?:下|本)?周[一二三四五六日天])\s*(?:回|返回|返程|回来)/) ||
      q.match(/((?:下|本)?周[一二三四五六日天])(?!.*周[一二三四五六日天])/);
    var startDate = resolveWeekdayToken(startTokenMatch && startTokenMatch[0], new Date());
    var endDate = null;
    if (endTokenMatch) {
      var endTok = endTokenMatch[1] || endTokenMatch[0];
      if (/^周/.test(endTok) && startDate) endDate = dateOnWeek(startOfWeekMonday(startDate), WEEKDAY_CHAR[endTok.replace(/^周/, "")]);
      else endDate = resolveWeekdayToken(endTok, startDate || new Date());
    }
    if (!startDate || !endDate) return null;
    if (endDate.getTime() < startDate.getTime()) { endDate = new Date(endDate); endDate.setDate(endDate.getDate() + 7); }
    var nights = Math.max(0, Math.round((endDate - startDate) / (24 * 3600 * 1000)));
    return {
      destination: destination,
      startDate: startDate, endDate: endDate, nights: nights,
      reason: extractTripReason(q), origin: "湘潭", railClass: "高铁二等座", hotelRate: 400
    };
  }
  function buildTripExpenseLines(trip) {
    return [
      "去程 " + trip.railClass,
      "返程 " + trip.railClass,
      "住宿 " + (trip.nights || 0) + " 晚 × ¥" + trip.hotelRate + "/晚",
      "市内交通及餐补（按一般员工标准）"
    ];
  }

  function normalizeBase(raw) {
    var base = String(raw || "").trim().replace(/\/+$/, "");
    if (/^http:\/\/agent\.unidt\.com\b/i.test(base)) base = base.replace(/^http:/i, "https:");
    return base;
  }

  function readConfig() {
    var params = new URLSearchParams(location.search);

    var selected = [];
    try { selected = JSON.parse(localStorage.getItem(STORAGE_SELECTED) || "[]"); } catch (e) { selected = []; }
    return {
      apiBase: normalizeBase(fromQuery || localStorage.getItem(STORAGE_BASE) || DEFAULT_API_BASE),

  function writeConfig(partial) {
    var cur = readConfig();
    var next = Object.assign({}, cur, partial || {});
    localStorage.setItem(STORAGE_BASE, next.apiBase);
    localStorage.setItem(STORAGE_KEY, next.apiKey);
    localStorage.setItem(STORAGE_METHOD, next.method);
    localStorage.setItem(STORAGE_TOPK, String(next.topK));
    localStorage.setItem(STORAGE_THRESHOLD, String(next.threshold));
    localStorage.setItem(STORAGE_SELECTED, JSON.stringify(next.selectedIds || []));
  }

  async function listDatasets() {
    var cfg = readConfig();
    var res = await fetch(cfg.apiBase + "/datasets?page=1&limit=100", {
      headers: { Authorization: "Bearer " + cfg.apiKey }
    });
    if (!res.ok) throw new Error("知识库列表失败 " + res.status);
    var data = await res.json();
    var list = (data && (data.data || data)) || [];
    if (!Array.isArray(list)) list = [];
    return { list: list, total: data && data.total };
  }

  async function retrieve(query) {
    var cfg = readConfig();
    var ids = cfg.selectedIds || [];
    if (!ids.length) return [];
    var all = [];
    for (var i = 0; i < ids.length; i++) {
      var res = await fetch(cfg.apiBase + "/datasets/" + ids[i] + "/" + cfg.method, {
        method: "POST",
        headers: {
          Authorization: "Bearer " + cfg.apiKey,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          query: query,
          top_k: Number(cfg.topK) || 3,
          score_threshold: Number(cfg.threshold) || 0
        })
      });
      if (!res.ok) continue;
      var data = await res.json();
      var records = (data && (data.records || data.data || data)) || [];
      if (Array.isArray(records)) all = all.concat(records);
    }
    return all;
  }

  function buildContext(results) {
    return (results || []).map(function (r, idx) {
      var content = (r && (r.content || r.segment && r.segment.content)) || JSON.stringify(r);
      return "[" + (idx + 1) + "] " + String(content).slice(0, 1200);
    }).join("\n\n");
  }

  function polishAnswer(text) {
    return String(text || "")
      .replace(/\*\*/g, "")
      .replace(/^#+\s*/gm, "")
      .replace(/依据[：:].+/g, "")
      .replace(/附录\s*\d+[^\n]*/g, "")
      .trim();
  }

  async function streamLLM(messages, onDelta, signal) {
    var res = await fetch(LLM_API_URL, {
      method: "POST",
      headers: {
        Authorization: "Bearer " + LLM_API_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ model: LLM_MODEL, messages: messages, stream: true }),
      signal: signal
    });
    if (!res.ok) throw new Error("模型请求失败 " + res.status);
    var reader = res.body.getReader();
    var decoder = new TextDecoder();
    var full = "";
    var buf = "";
    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buf += decoder.decode(chunk.value, { stream: true });
      var parts = buf.split("\n");
      buf = parts.pop() || "";
      for (var i = 0; i < parts.length; i++) {
        var line = parts[i].trim();
        if (line.indexOf("data:") !== 0) continue;
        var payload = line.slice(5).trim();
        if (!payload || payload === "[DONE]") continue;
        try {
          var json = JSON.parse(payload);
          var delta = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
          if (delta) {
            full += delta;
            if (onDelta) onDelta(polishAnswer(full));
          }
        } catch (e) {}
      }
    }
    return polishAnswer(full);
  }

  function setVoiceStatus(text, active) {

  function setMicListening(on) {
    voiceListening = !!on;

  function stopVoiceInput() {
    if (recognition) {
      try { recognition.stop(); } catch (e) {}
    }
    setMicListening(false);
    setVoiceStatus("", false);
  }

  function startVoiceInput() {
    if (busy) return;
    if (voiceListening) {
      stopVoiceInput();
      return;
    }
    stopListenHubSpeech();
    voiceFinal = "";
    if (!recognition) {
      recognition = createSpeechRecognizer({
        onStart: function () {
          setMicListening(true);
          setVoiceStatus("正在聆听，请说话…", true);
        },
        onResult: function (payload) {
          var text = payload.transcript || "";
          if (payload.finalText) voiceFinal = String(payload.finalText).trim();
          if (text) input.value = text;
          if (payload.finalText) setVoiceStatus("识别完成，正在发送…", true);
          else setVoiceStatus("正在聆听：" + (payload.interim || "…"), true);
        },
        onError: function (event) {
          var code = event && event.error ? event.error : "";
          var tip = "语音识别失败，请重试";
          if (code === "not-allowed") tip = "未获得麦克风权限，请在浏览器中允许后重试";
          else if (code === "no-speech") tip = "未检测到语音，请靠近麦克风再说一次";
          else if (code === "audio-capture") tip = "无法访问麦克风，请检查设备";
          else if (code === "network") tip = "语音识别网络异常，请稍后重试";
          setVoiceStatus(tip, false);
          setMicListening(false);
        },
        onEnd: function () {
          setMicListening(false);
          var q = (voiceFinal || input.value || "").trim();
          voiceFinal = "";
          if (!q) {
            if (voiceStatus && /正在聆听/.test(voiceStatus.textContent || "")) {
              setVoiceStatus("未识别到有效内容", false);
            }
            return;
          }
          input.value = q;
          voiceAsked = true;
          setVoiceStatus("", false);
          ask(q);
        }
      });
    }
    if (!recognition) {
      setVoiceStatus("当前浏览器不支持语音识别，请改用文字输入", false);
      return;
    }
    try {
      recognition.start();
    } catch (err) {
      setVoiceStatus("无法启动语音识别：" + (err.message || err), false);
      setMicListening(false);
    }
  }

  async function ask(question) {
    var q = String(question || "").trim();
    if (!q || busy) return;
    var fromVoice = !!voiceAsked;
    voiceAsked = false;
    busy = true;
    send.disabled = true;
    if (btnMic) btnMic.disabled = true;
    stopListenHubSpeech();
    addUser(q);
    input.value = "";
    showTyping();
    abort = new AbortController();
    var speakText = "";
    try {
      var deniedRanks = detectRestrictedRankAsk(q);
      if (deniedRanks.length) {
        hideTyping();
        var denied = addBotShell();
        speakText = buildRankDeniedReply(deniedRanks);
        denied.body.textContent = speakText;
        return;
      }
      var trip = parseTripAssistIntent(q);
      if (trip) {
        hideTyping();
        renderTripAssistFlow(trip);
        speakText = "已为您生成差旅辅助卡片，请确认行程后提交。";
        return;
      }
      var results = await retrieve(q);
      var sources = results.slice(0, 5);
      hideTyping();
      var bot = addBotShell();
      bot.body.textContent = results.length ? "正在根据知识库生成回答…" : "未检索到相关片段，尝试通则作答…";
      var answer = await streamLLM(
        [
          { role: "system", content: LLM_SYSTEM },
          {
            role: "user",
            content: buildAskUserPrompt(q, buildContext(results))
          }
        ],
        function (full) {
          bot.body.textContent = full;
          chat.scrollTop = chat.scrollHeight;
        },
        abort.signal
      );
      if (!answer) bot.body.textContent = "模型未返回内容，请稍后重试。";
      else bot.body.textContent = answer;
      speakText = bot.body.textContent || "";
      var fb = document.createElement("div");
      fb.className = "feedback";
      fb.innerHTML = "<span aria-hidden='true'>↑</span><span aria-hidden='true'>↓</span>";
      bot.bubble.appendChild(fb);
      renderCollapsedSources(bot.col, sources);
      chat.scrollTop = chat.scrollHeight;
    } catch (err) {
      hideTyping();
      var botErr = addBotShell();
      speakText = "问答失败：" + (err && err.message ? err.message : String(err));
      botErr.body.textContent = speakText;
    } finally {
      busy = false;
      abort = null;
      send.disabled = false;
      if (btnMic) btnMic.disabled = false;
      input.focus();
      if (fromVoice && speakText) {
        speakWithListenHub(speakText).catch(function () {});
      }
    }
  }

          '<p class="welcome-desc"></p>' +
        "</div>" +
        '<div class="welcome-avatar" aria-hidden="true"><div class="welcome-avatar-face">' + BOT_FACE_SVG + "</div></div>" +
      "</div>";
    card.querySelector(".welcome-desc").textContent = WELCOME_TEXT;
    chat.appendChild(card);
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    stopVoiceInput();
    ask(input.value);
  });
  if (btnMic) {
    btnMic.addEventListener("click", function () {
      startVoiceInput();
    });
  }
  btnNewChat.addEventListener("click", function () {
    if (busy) return;
    stopVoiceInput();
    stopListenHubSpeech();
    bootWelcome();
  });
  window.addEventListener("storage", function (e) {
    if (!e.key || String(e.key).indexOf("caizhi_") !== 0) return;
    ensureDatasets();
  });

  renderChips();
  bootWelcome();
  ensureDatasets();
})();
  </script>
</body>
</html>
