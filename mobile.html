<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>财知 · 企微智能体</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #3b82f6;
      --blue-deep: #2563eb;
      --blue-soft: #dbeafe;
      --bubble-bot: #e8f1ff;
      --ink: #1e293b;
      --muted: #64748b;
      --line: rgba(37, 99, 235, 0.12);
      --bg: linear-gradient(180deg, #f0f6ff 0%, #f8fafc 45%, #eef4ff 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Noto Sans SC", sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      justify-content: center;
    }
    .phone {
      width: min(430px, 100%);
      height: 100%;
      display: flex;
      flex-direction: column;
      background: transparent;
      position: relative;
    }
    .topbar {
      flex-shrink: 0;
      background: var(--blue);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1rem;
      padding-top: calc(0.85rem + env(safe-area-inset-top, 0px));
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
    }
    .topbar .title { font-weight: 600; font-size: 1.05rem; letter-spacing: 0.02em; }
    .topbar button {
      appearance: none; border: 0; background: transparent; color: #fff;
      font-size: 1.15rem; width: 2rem; height: 2rem; cursor: pointer;
    }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0.9rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .msg { max-width: 88%; animation: pop 0.28s ease both; }
    .msg.user { align-self: flex-end; }
    .msg.bot { align-self: flex-start; display: flex; gap: 0.45rem; }
    .avatar {
      width: 1.7rem; height: 1.7rem; border-radius: 50%;
      background: var(--blue-soft); color: var(--blue-deep);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; flex-shrink: 0; margin-top: 0.15rem;
    }
    .bubble {
      border-radius: 1rem;
      padding: 0.75rem 0.9rem;
      line-height: 1.65;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
    }
    .msg.user .bubble { background: #fff; color: var(--ink); border-bottom-right-radius: 0.35rem; }
    .msg.bot .bubble { background: var(--bubble-bot); color: #1e3a5f; border-bottom-left-radius: 0.35rem; }
    .feedback {
      display: flex; gap: 0.55rem; justify-content: flex-end;
      margin-top: 0.45rem; opacity: 0.55; font-size: 0.85rem;
    }
    .src-block { margin-top: 0.55rem; }
    .src-toggle {
      appearance: none; border: 0; background: transparent;
      color: var(--muted); font: inherit; font-size: 0.8rem;
      display: flex; align-items: center; gap: 0.35rem; cursor: pointer; padding: 0.2rem 0;
    }
    .src-panel { margin-top: 0.4rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .src-item {
      background: #fff; border-radius: 999px; padding: 0.55rem 0.85rem;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      border: 1px solid var(--line);
    }
    .src-meta { display: flex; align-items: center; gap: 0.35rem; font-size: 0.82rem; color: var(--blue-deep); font-weight: 500; }
    .src-body { display: none; }
    .src-panel[data-detail="1"] .src-body {
      display: block; margin-top: 0.35rem; font-size: 0.75rem; color: var(--muted);
      line-height: 1.45; white-space: pre-wrap;
    }
    .dock {
      flex-shrink: 0;
      padding: 0.55rem 0.75rem calc(0.75rem + env(safe-area-inset-bottom, 0px));
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
    }
    .chips {
      display: flex; gap: 0.45rem; overflow-x: auto; padding-bottom: 0.55rem;
      -webkit-overflow-scrolling: touch;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      appearance: none; flex-shrink: 0;
      border: 1px solid rgba(59, 130, 246, 0.35);
      background: #fff; color: var(--blue-deep);
      font: inherit; font-size: 0.78rem;
      padding: 0.4rem 0.75rem; border-radius: 999px; cursor: pointer;
      white-space: nowrap;
    }
    .chip.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .composer {
      display: flex; gap: 0.5rem; align-items: center;
    }
    .composer input {
      flex: 1; border: 0; background: #fff; border-radius: 999px;
      padding: 0.8rem 1rem; font: inherit; font-size: 0.92rem;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
      outline: none;
    }
    .composer .mic, .composer .send {
      width: 2.7rem; height: 2.7rem; border-radius: 50%;
      border: 0; background: var(--blue); color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.05rem;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.3);
    }
    .composer .send:disabled { opacity: 0.5; cursor: not-allowed; }
    .typing {
      align-self: flex-start; display: flex; gap: 0.28rem;
      padding: 0.7rem 0.9rem; background: var(--bubble-bot); border-radius: 1rem;
    }
    .typing i {
      width: 6px; height: 6px; border-radius: 50%; background: var(--blue);
      display: block; animation: blink 1.1s infinite ease-in-out;
    }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    .hint { font-size: 0.72rem; color: var(--muted); text-align: center; padding: 0.2rem 0 0.35rem; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; transform: none; }
      40% { opacity: 1; transform: translateY(-3px); }
    }
  </style>
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <button type="button" aria-label="返回" onclick="history.length>1?history.back():location.href='pc.html'">‹</button>
      <div class="title">财知智能体</div>
      <button type="button" aria-label="菜单" title="PC 端可改配置" onclick="location.href='pc.html'">⋯</button>
    </header>

    <div class="chat" id="chat" role="log" aria-live="polite"></div>

    <div class="dock">
      <div class="chips" id="chips"></div>
      <form class="composer" id="form" autocomplete="off">
        <input id="input" type="text" maxlength="800" placeholder="有什么可以帮到你的" aria-label="问题输入" />
        <button class="send" type="submit" id="send" aria-label="发送">➤</button>
      </form>
      <div class="hint" id="hint">配置请在 PC 端侧栏修改，本页自动同步</div>
    </div>
  </div>

  <script src="js/caizhi-core.js"></script>
  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const chips = document.getElementById("chips");
    const hint = document.getElementById("hint");
    let busy = false;
    let abort = null;

    function addUser(text) {
      const wrap = document.createElement("div");
      wrap.className = "msg user";
      wrap.innerHTML = '<div class="bubble"></div>';
      wrap.querySelector(".bubble").textContent = text;
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
    }

    function addBotShell() {
      const wrap = document.createElement("div");
      wrap.className = "msg bot";
      wrap.innerHTML =
        '<div class="avatar">知</div><div class="col"><div class="bubble"><div class="body"></div></div></div>';
      const col = wrap.querySelector(".col");
      col.style.display = "flex";
      col.style.flexDirection = "column";
      col.style.maxWidth = "100%";
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
      return {
        wrap,
        body: wrap.querySelector(".body"),
        bubble: wrap.querySelector(".bubble"),
        col
      };
    }

    function showTyping() {
      const t = document.createElement("div");
      t.className = "typing";
      t.id = "typing";
      t.innerHTML = "<i></i><i></i><i></i>";
      chat.appendChild(t);
      chat.scrollTop = chat.scrollHeight;
    }
    function hideTyping() {
      const t = document.getElementById("typing");
      if (t) t.remove();
    }

    function renderChips() {
      chips.innerHTML = "";
      const neu = document.createElement("button");
      neu.type = "button";
      neu.className = "chip primary";
      neu.textContent = "+ 新对话";
      neu.addEventListener("click", () => {
        chat.innerHTML = "";
        bootWelcome();
      });
      chips.appendChild(neu);
      Caizhi.SUGGESTIONS.forEach((q) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.textContent = q.length > 10 ? q.slice(0, 10) + "…" : q;
        b.title = q;
        b.addEventListener("click", () => ask(q));
        chips.appendChild(b);
      });
    }

    async function ensureDatasets() {
      try {
        const { list, total } = await Caizhi.listDatasets();
        const cfg = Caizhi.readConfig();
        if (!cfg.selectedIds.length && list.length) {
          Caizhi.writeConfig({ selectedIds: [list[0].id] });
        }
        hint.textContent = "已同步配置 · 知识库 " + (total != null ? total : list.length) + " 个";
      } catch (e) {
        hint.textContent = "知识库连接失败，请到 PC 端检查配置";
      }
    }

    async function ask(question) {
      const q = String(question || "").trim();
      if (!q || busy) return;
      busy = true;
      send.disabled = true;
      addUser(q);
      input.value = "";
      showTyping();
      abort = new AbortController();
      try {
        const results = await Caizhi.retrieve(q);
        const sources = results.slice(0, 5);
        hideTyping();
        const bot = addBotShell();
        bot.body.textContent = results.length ? "正在根据知识库生成回答…" : "未检索到相关片段，尝试通则作答…";
        const answer = await Caizhi.streamLLM(
          [
            { role: "system", content: Caizhi.LLM_SYSTEM },
            {
              role: "user",
              content:
                "用户问题：\n" + q + "\n\n知识库检索片段：\n" + Caizhi.buildContext(results) +
                "\n\n请基于上述片段作答；若片段无关，请说明资料不足。"
            }
          ],
          (full) => {
            bot.body.textContent = full;
            chat.scrollTop = chat.scrollHeight;
          },
          abort.signal
        );
        if (!answer) bot.body.textContent = "模型未返回内容，请稍后重试。";
        const fb = document.createElement("div");
        fb.className = "feedback";
        fb.innerHTML = "<span>👍</span><span>👎</span>";
        bot.bubble.appendChild(fb);
        Caizhi.renderCollapsedSources(bot.col, sources);
        const panel = bot.col.querySelector(".src-panel");
        if (panel) panel.dataset.detail = "1";
        chat.scrollTop = chat.scrollHeight;
      } catch (err) {
        hideTyping();
        const bot = addBotShell();
        bot.body.textContent = "问答失败：" + (err.message || err);
      } finally {
        busy = false;
        abort = null;
        send.disabled = false;
        input.focus();
      }
    }

    function bootWelcome() {
      const bot = addBotShell();
      bot.body.textContent =
        "你好，我是「财知」。可咨询报销、核算、预算、税务等制度问题；回答下方「相关材料」默认收起，点击即可展开。";
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      ask(input.value);
    });

    window.addEventListener("storage", (e) => {
      if (!e.key || !String(e.key).startsWith("caizhi_")) return;
      ensureDatasets();
    });

    renderChips();
    bootWelcome();
    ensureDatasets();
  </script>
</body>
</html>
