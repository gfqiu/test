<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>湘财 · 企微智能体</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #3b82f6;
      --blue-deep: #2563eb;
      --blue-soft: #dbeafe;
      --bubble-bot: #e8f1ff;
      --ink: #1e293b;
      --muted: #64748b;
      --line: rgba(37, 99, 235, 0.12);
      --bg: linear-gradient(180deg, #f0f6ff 0%, #f8fafc 45%, #eef4ff 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Noto Sans SC", sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      justify-content: center;
    }
    .phone {
      width: min(430px, 100%);
      height: 100%;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      flex-shrink: 0;
      background: var(--blue);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1rem;
      padding-top: calc(0.85rem + env(safe-area-inset-top, 0px));
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
    }
    .topbar .title { font-weight: 600; font-size: 1.05rem; }
    .topbar button {
      appearance: none; border: 0; background: transparent; color: #fff;
      font-size: 1.15rem; width: 2rem; height: 2rem; cursor: pointer;
    }
    .chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 1rem 0.9rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .msg { max-width: 88%; animation: pop 0.28s ease both; }
    .msg.user { align-self: flex-end; }
    .msg.bot { align-self: flex-start; display: flex; gap: 0.45rem; }
    .avatar {
      width: 1.7rem; height: 1.7rem; border-radius: 50%;
      background: var(--blue-soft); color: var(--blue-deep);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; flex-shrink: 0; margin-top: 0.15rem;
    }
    .bubble {
      border-radius: 1rem;
      padding: 0.75rem 0.9rem;
      line-height: 1.65;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
    }
    .msg.user .bubble { background: #fff; border-bottom-right-radius: 0.35rem; }
    .msg.bot .bubble { background: var(--bubble-bot); color: #1e3a5f; border-bottom-left-radius: 0.35rem; }
    .col { display: flex; flex-direction: column; max-width: 100%; }
    .feedback { display: flex; gap: 0.55rem; justify-content: flex-end; margin-top: 0.45rem; opacity: 0.55; font-size: 0.85rem; }
    .src-block { margin-top: 0.55rem; }
    .src-toggle {
      appearance: none; border: 0; background: transparent;
      color: var(--muted); font: inherit; font-size: 0.8rem;
      display: flex; align-items: center; gap: 0.35rem; cursor: pointer; padding: 0.2rem 0;
    }
    .src-panel { margin-top: 0.4rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .src-panel[hidden], .src-panel.is-collapsed { display: none !important; }
    .src-item {
      background: #fff; border-radius: 12px; padding: 0.55rem 0.85rem;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      border: 1px solid var(--line);
    }
    .src-meta { display: flex; align-items: center; gap: 0.35rem; font-size: 0.82rem; color: var(--blue-deep); font-weight: 500; }
    .src-body { margin-top: 0.35rem; font-size: 0.75rem; color: var(--muted); line-height: 1.45; white-space: pre-wrap; }
    .dock {
      flex-shrink: 0;
      padding: 0.55rem 0.75rem calc(0.75rem + env(safe-area-inset-bottom, 0px));
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
    }
    .chips { display: flex; gap: 0.45rem; overflow-x: auto; padding-bottom: 0.55rem; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      appearance: none; flex-shrink: 0;
      border: 1px solid rgba(59, 130, 246, 0.35);
      background: #fff; color: var(--blue-deep);
      font: inherit; font-size: 0.78rem;
      padding: 0.4rem 0.75rem; border-radius: 999px; cursor: pointer;
      white-space: nowrap;
    }
    .chip.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .composer { display: flex; gap: 0.5rem; align-items: center; }
    .composer input {
      flex: 1; border: 0; background: #fff; border-radius: 999px;
      padding: 0.8rem 1rem; font: inherit; font-size: 0.92rem;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
      outline: none;
    }
    .composer .send {
      width: 2.7rem; height: 2.7rem; border-radius: 50%;
      border: 0; background: var(--blue); color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.05rem;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.3);
    }
    .composer .send:disabled { opacity: 0.5; cursor: not-allowed; }
    .typing {
      align-self: flex-start; display: flex; gap: 0.28rem;
      padding: 0.7rem 0.9rem; background: var(--bubble-bot); border-radius: 1rem;
    }
    .typing i {
      width: 6px; height: 6px; border-radius: 50%; background: var(--blue);
      display: block; animation: blink 1.1s infinite ease-in-out;
    }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    .hint { font-size: 0.72rem; color: var(--muted); text-align: center; padding: 0.2rem 0 0.35rem; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; }
      40% { opacity: 1; transform: translateY(-3px); }
    }
  </style>
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <button type="button" aria-label="返回" onclick="location.href='index.html'">‹</button>
      <div class="title">湘财智能体</div>
      <button type="button" aria-label="菜单" onclick="location.href='index.html'">⋯</button>
    </header>
    <div class="chat" id="chat" role="log" aria-live="polite"></div>
    <div class="dock">
      <div class="chips" id="chips"></div>
      <form class="composer" id="form" autocomplete="off">
        <input id="input" type="text" maxlength="800" placeholder="有什么可以帮到你的" aria-label="问题输入" />
        <button class="send" type="submit" id="send" aria-label="发送">➤</button>
      </form>
      <div class="hint" id="hint">配置请在 PC 端侧栏修改，本页自动同步</div>
    </div>
  </div>

  <script>
(function () {
  "use strict";

  var DEFAULT_API_BASE = "https://agent.unidt.com/v1";
  var DEFAULT_API_KEY = "dataset-adoZr8SvffoDDlAGZibbdAip";
  var STORAGE_BASE = "caizhi_api_base";
  var STORAGE_KEY = "caizhi_api_key";
  var STORAGE_SELECTED = "caizhi_selected_ids";
  var STORAGE_METHOD = "caizhi_method";
  var STORAGE_TOPK = "caizhi_topk";
  var STORAGE_THRESHOLD = "caizhi_threshold";
  var LLM_API_URL = "https://ai-api.unidtai.com/openapi/llm/compatible-mode/v1/chat/completions";
  var LLM_API_KEY = "sk-60569506137942a6a2b18b7aedbef8d1";
  var LLM_MODEL = "deepseek/deepseek-v4-flash-vision-exp";
  var LLM_SYSTEM =
    "你是企业内部财务智能知识助手「湘财」。请严格依据用户提供的知识库检索片段回答；" +
    "若片段不足以回答，请明确说明资料不足，不要编造制度条文。回答简洁、分点，使用中文。不要透露底层模型名称。";
  var SUGGESTIONS = [
    "差旅费报销需要哪些票据？",
    "费用报销审批流程是怎样的？",
    "固定资产如何入账与折旧？",
    "预算追加需要什么材料？",
    "增值税专用发票如何认证？"
  ];

  function normalizeBase(raw) {
    var base = String(raw || "").trim().replace(/\/+$/, "");
    if (/^http:\/\/agent\.unidt\.com\b/i.test(base)) base = base.replace(/^http:/i, "https:");
    return base;
  }

  function readConfig() {
    var params = new URLSearchParams(location.search);
    var fromQuery = params.get("base") || params.get("api");
    var selectedIds = [];
    try {
      var arr = JSON.parse(localStorage.getItem(STORAGE_SELECTED) || "[]");
      if (Array.isArray(arr)) selectedIds = arr;
    } catch (e) {}
    return {
      apiBase: normalizeBase(fromQuery || localStorage.getItem(STORAGE_BASE) || DEFAULT_API_BASE),
      apiKey: localStorage.getItem(STORAGE_KEY) || DEFAULT_API_KEY,
      method: localStorage.getItem(STORAGE_METHOD) || "hybrid_search",
      topK: localStorage.getItem(STORAGE_TOPK) || "3",
      threshold: localStorage.getItem(STORAGE_THRESHOLD) || "0",
      selectedIds: selectedIds
    };
  }

  function writeConfig(partial) {
    partial = partial || {};
    if (partial.apiBase != null) localStorage.setItem(STORAGE_BASE, normalizeBase(partial.apiBase));
    if (partial.apiKey != null) localStorage.setItem(STORAGE_KEY, String(partial.apiKey).trim() || DEFAULT_API_KEY);
    if (partial.method != null) localStorage.setItem(STORAGE_METHOD, partial.method);
    if (partial.topK != null) localStorage.setItem(STORAGE_TOPK, String(partial.topK));
    if (partial.threshold != null) localStorage.setItem(STORAGE_THRESHOLD, String(partial.threshold));
    if (partial.selectedIds != null) localStorage.setItem(STORAGE_SELECTED, JSON.stringify(Array.from(partial.selectedIds)));
    return readConfig();
  }

  async function kbFetch(path, options) {
    var cfg = readConfig();
    var base = normalizeBase(cfg.apiBase);
    if (!base) throw new Error("请先配置 API Base");
    var headers = {
      Authorization: "Bearer " + (cfg.apiKey || DEFAULT_API_KEY),
      "Content-Type": "application/json"
    };
    if (options && options.headers) {
      for (var k in options.headers) headers[k] = options.headers[k];
    }
    var res = await fetch(base + path, {
      method: (options && options.method) || "GET",
      headers: headers,
      body: options && options.body
    });
    var text = await res.text();
    var data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = { raw: text }; }
    if (!res.ok) {
      var msg = (data && (data.message || data.errorMsg || data.error || data.detail)) || text || res.statusText;
      throw new Error("HTTP " + res.status + " · " + msg);
    }
    return data;
  }

  async function listDatasets() {
    var data = await kbFetch("/knowledge/datasets?page=1&limit=50");
    return { list: Array.isArray(data && data.data) ? data.data : [], total: data && data.total };
  }

  async function retrieve(query, selectedIds) {
    var cfg = readConfig();
    var ids = selectedIds && selectedIds.length ? selectedIds : cfg.selectedIds;
    if (!ids.length) throw new Error("请至少选择一个知识库（可在 PC 端配置页勾选）");
    var method = cfg.method || "hybrid_search";
    var topK = Math.max(1, parseInt(cfg.topK, 10) || 3);
    var scoreThreshold = Number(cfg.threshold);
    var threshold = Number.isFinite(scoreThreshold) ? scoreThreshold : 0;
    if (ids.length === 1) {
      var data = await kbFetch("/knowledge/datasets/" + encodeURIComponent(ids[0]) + "/retrieval", {
        method: "POST",
        body: JSON.stringify({ query: query, retrieval_method: method, top_k: topK, score_threshold: threshold })
      });
      return Array.isArray(data && data.result) ? data.result : [];
    }
    var qs = new URLSearchParams();
    ids.forEach(function (id) { qs.append("dataset_ids", id); });
    qs.set("query", query);
    qs.set("retrieval_method", method);
    qs.set("top_k", String(topK));
    qs.set("score_threshold", String(threshold));
    var data2 = await kbFetch("/knowledge/datasets/retrieval?" + qs.toString(), { method: "GET" });
    return Array.isArray(data2 && data2.result) ? data2.result : [];
  }

  function buildContext(results) {
    if (!results || !results.length) return "（未检索到相关片段）";
    return results.slice(0, 5).map(function (r, i) {
      var title = r.title || (r.metadata && r.metadata.document_name) || ("片段 " + (i + 1));
      var body = String(r.content || "").replace(/\s+/g, " ").trim();
      return "[" + (i + 1) + "] " + title + "\n" + (body.length > 1200 ? body.slice(0, 1200) + "…" : body);
    }).join("\n\n");
  }

  async function streamLLM(messages, onDelta, signal) {
    var response = await fetch(LLM_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + LLM_API_KEY },
      body: JSON.stringify({ model: LLM_MODEL, messages: messages, stream: true }),
      signal: signal
    });
    if (!response.ok) {
      var errText = await response.text();
      throw new Error("LLM HTTP " + response.status + " · " + errText.slice(0, 240));
    }
    var reader = response.body.getReader();
    var decoder = new TextDecoder();
    var buffer = "";
    var full = "";
    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, { stream: true });
      var lines = buffer.split("\n");
      buffer = lines.pop() || "";
      for (var i = 0; i < lines.length; i++) {
        var trimmed = lines[i].trim();
        if (!trimmed || trimmed.indexOf("data:") !== 0) continue;
        var payload = trimmed.slice(5).trim();
        if (payload === "[DONE]") continue;
        try {
          var parsed = JSON.parse(payload);
          var delta = parsed.choices && parsed.choices[0] && parsed.choices[0].delta && parsed.choices[0].delta.content;
          if (delta) {
            full += delta;
            onDelta(full, delta);
          }
        } catch (e) {}
      }
    }
    return full;
  }

  function sourceTitle(s) {
    return s.title || (s.metadata && s.metadata.document_name) || "文档";
  }

  function sourceScore(s) {
    var score = s.metadata && (s.metadata.rerank_score != null ? s.metadata.rerank_score : s.metadata.score);
    return score != null ? Number(score) : null;
  }

  function renderCollapsedSources(container, sources) {
    if (!sources || !sources.length) return;
    var block = document.createElement("div");
    block.className = "src-block";
    var toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "src-toggle";
    toggle.setAttribute("aria-expanded", "false");
    var label = document.createElement("span");
    label.className = "src-toggle-label";
    label.textContent = "相关材料 · " + sources.length + " 份";
    var chevron = document.createElement("span");
    chevron.className = "src-chevron";
    chevron.textContent = "▾";
    toggle.appendChild(label);
    toggle.appendChild(chevron);
    var panel = document.createElement("div");
    panel.className = "src-panel is-collapsed";
    panel.hidden = true;
    sources.forEach(function (s) {
      var item = document.createElement("div");
      item.className = "src-item";
      var score = sourceScore(s);
      var meta = document.createElement("div");
      meta.className = "src-meta";
      var clip = document.createElement("span");
      clip.textContent = "📎";
      var nameEl = document.createElement("span");
      nameEl.className = "src-name";
      nameEl.textContent = sourceTitle(s) + (score != null ? " · " + score.toFixed(3) : "");
      meta.appendChild(clip);
      meta.appendChild(nameEl);
      var body = document.createElement("div");
      body.className = "src-body";
      var snippet = String(s.content || "").replace(/\s+/g, " ").trim();
      body.textContent = snippet.length > 280 ? snippet.slice(0, 280) + "…" : snippet;
      item.appendChild(meta);
      item.appendChild(body);
      panel.appendChild(item);
    });
    toggle.addEventListener("click", function () {
      var open = panel.hidden;
      panel.hidden = !open;
      if (open) panel.classList.remove("is-collapsed");
      else panel.classList.add("is-collapsed");
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
      chevron.textContent = open ? "▴" : "▾";
    });
    block.appendChild(toggle);
    block.appendChild(panel);
    container.appendChild(block);
  }

  // 页面 UI
  var chat = document.getElementById("chat");
  var form = document.getElementById("form");
  var input = document.getElementById("input");
  var send = document.getElementById("send");
  var chips = document.getElementById("chips");
  var hint = document.getElementById("hint");
  var busy = false;
  var abort = null;

  function addUser(text) {
    var wrap = document.createElement("div");
    wrap.className = "msg user";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function addBotShell() {
    var wrap = document.createElement("div");
    wrap.className = "msg bot";
    var avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "湘";
    var col = document.createElement("div");
    col.className = "col";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    var body = document.createElement("div");
    body.className = "body";
    bubble.appendChild(body);
    col.appendChild(bubble);
    wrap.appendChild(avatar);
    wrap.appendChild(col);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return { wrap: wrap, body: body, bubble: bubble, col: col };
  }

  function showTyping() {
    var t = document.createElement("div");
    t.className = "typing";
    t.id = "typing";
    t.innerHTML = "<i></i><i></i><i></i>";
    chat.appendChild(t);
    chat.scrollTop = chat.scrollHeight;
  }
  function hideTyping() {
    var t = document.getElementById("typing");
    if (t) t.remove();
  }

  function renderChips() {
    chips.innerHTML = "";
    var neu = document.createElement("button");
    neu.type = "button";
    neu.className = "chip primary";
    neu.textContent = "+ 新对话";
    neu.addEventListener("click", function () {
      chat.innerHTML = "";
      bootWelcome();
    });
    chips.appendChild(neu);
    SUGGESTIONS.forEach(function (q) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = q.length > 10 ? q.slice(0, 10) + "…" : q;
      b.title = q;
      b.addEventListener("click", function () { ask(q); });
      chips.appendChild(b);
    });
  }

  async function ensureDatasets() {
    try {
      var res = await listDatasets();
      var cfg = readConfig();
      if (!cfg.selectedIds.length && res.list.length) {
        writeConfig({ selectedIds: [res.list[0].id] });
      }
      hint.textContent = "已同步配置 · 知识库 " + (res.total != null ? res.total : res.list.length) + " 个";
    } catch (e) {
      hint.textContent = "知识库连接失败，请到 PC 端检查配置";
    }
  }

  async function ask(question) {
    var q = String(question || "").trim();
    if (!q || busy) return;
    busy = true;
    send.disabled = true;
    addUser(q);
    input.value = "";
    showTyping();
    abort = new AbortController();
    try {
      var results = await retrieve(q);
      var sources = results.slice(0, 5);
      hideTyping();
      var bot = addBotShell();
      bot.body.textContent = results.length ? "正在根据知识库生成回答…" : "未检索到相关片段，尝试通则作答…";
      var answer = await streamLLM(
        [
          { role: "system", content: LLM_SYSTEM },
          {
            role: "user",
            content:
              "用户问题：\n" + q + "\n\n知识库检索片段：\n" + buildContext(results) +
              "\n\n请基于上述片段作答；若片段无关，请说明资料不足。"
          }
        ],
        function (full) {
          bot.body.textContent = full;
          chat.scrollTop = chat.scrollHeight;
        },
        abort.signal
      );
      if (!answer) bot.body.textContent = "模型未返回内容，请稍后重试。";
      var fb = document.createElement("div");
      fb.className = "feedback";
      fb.innerHTML = "<span>👍</span><span>👎</span>";
      bot.bubble.appendChild(fb);
      renderCollapsedSources(bot.col, sources);
      chat.scrollTop = chat.scrollHeight;
    } catch (err) {
      hideTyping();
      var botErr = addBotShell();
      botErr.body.textContent = "问答失败：" + (err && err.message ? err.message : String(err));
    } finally {
      busy = false;
      abort = null;
      send.disabled = false;
      input.focus();
    }
  }

  function bootWelcome() {
    var bot = addBotShell();
    bot.body.textContent =
      "你好，我是「湘财」。可咨询报销、核算、预算、税务等制度问题；回答下方「相关材料」默认收起，点击即可展开。";
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    ask(input.value);
  });
  window.addEventListener("storage", function (e) {
    if (!e.key || String(e.key).indexOf("caizhi_") !== 0) return;
    ensureDatasets();
  });

  renderChips();
  bootWelcome();
  ensureDatasets();
})();
  </script>
</body>
</html>
