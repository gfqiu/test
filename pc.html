<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>湘财晓助 | 财务智能办公助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <style>
    :root {
      --bg-page: #FFFFFF;
      --ai-card: #F2F4FB;
      --brand: #0047EA;
      --brand-soft: #EBF1FE;
      --icon-bg: #DEE6FF;
      --icon-blue: #2A67F4;
      --title: #001036;
      --text: #23272E;
      --ai-desc: #596793;
      --text-2: #535F6E;
      --hint: #8C97A6;
      --placeholder: #AFB6CC;
      --border: #E7E8ED;
      --card-border: #D3D9E9;
      --split: #E3E9F8;
      --disabled: #B9CAF1;
      --orange: #F09000;
      --orange-border: #FCE9CC;
      --label: #455586;
      --common: #303E5D;
      --blue: #0047EA;
      --blue-deep: #0047EA;
      --ink: #23272E;
      --muted: #8C97A6;
      --line: #E7E8ED;
      --bg: #FFFFFF;
      --card: #fff;
      --float-shadow: 0 2px 19px rgba(82, 92, 127, 0.29);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      color: var(--text);
      background: var(--bg-page);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 400;
    }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid rgba(0, 71, 234, 0.35);
      outline-offset: 2px;
    }
    .page {
      width: min(1200px, 100%);
      margin: 0 auto;
      padding: 20px 16px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hero {
      width: min(800px, 100%);
      text-align: center;
    }
    .hero h1 {
      font-size: 24px;
      font-weight: 600;
      color: var(--title);
      letter-spacing: 0.01em;
    }
    .layout {
      margin-top: 12px;
      width: min(800px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
      align-items: stretch;
      height: calc(100vh - 72px);
      min-height: 560px;
    }
    .chat-stage {
      height: 100%;
      max-height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg-page);
      border-radius: 20px;
      box-sizing: border-box;
    }
    .chat-card {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .chat-workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .chat-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg-page);
    }
    .chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 16px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--bg-page);
    }
    .welcome-card {
      width: min(420px, 100%);
      align-self: flex-start;
      background: var(--ai-card);
      border-radius: 20px;
      padding: 12px 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: rise 0.3s ease both;
    }
    .welcome-main {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .welcome-copy { flex: 1; min-width: 0; }
    .welcome-hello {
      font-size: 24px;
      font-weight: 600;
      color: var(--title);
      margin-bottom: 8px;
    }
    .welcome-desc {
      font-size: 13px;
      font-weight: 500;
      color: var(--ai-desc);
      line-height: 1.6;
    }
    .welcome-avatar {
      width: 88px;
      height: 88px;
      flex-shrink: 0;
      border-radius: 15px;
      position: relative;
      display: grid;
      place-items: center;
    }
    .welcome-avatar::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 20px;
      background: radial-gradient(circle at 40% 35%, rgba(122, 92, 255, 0.28), transparent 62%),
                  radial-gradient(circle at 70% 70%, rgba(255, 186, 170, 0.35), transparent 60%);
      filter: blur(8px);
      z-index: 0;
    }
    .welcome-avatar-face {
      position: relative;
      z-index: 1;
      width: 72px;
      height: 72px;
      border-radius: 14px;
      background: linear-gradient(145deg, #7b8cff 0%, #a78bfa 42%, #ffd6c9 100%);
      display: grid;
      place-items: center;
    }
    .welcome-avatar-face svg { width: 40px; height: 40px; display: block; }
    .history-mask[hidden] { display: none !important; }
    .msg { max-width: 86%; display: flex; gap: 10px; animation: rise 0.3s ease both; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg .ava {
      width: 36px; height: 36px; border-radius: 14px;
      flex-shrink: 0; overflow: hidden;
      display: grid; place-items: center;
      background: linear-gradient(145deg, #7b8cff 0%, #a78bfa 45%, #ffd6c9 100%);
      color: #fff; font-size: 12px; font-weight: 600;
    }
    .msg.user .ava {
      background: var(--icon-bg);
      color: var(--icon-blue);
      border-radius: 999px;
    }
    .msg .ava svg { width: 22px; height: 22px; display: block; }
    .bubble {
      background: var(--ai-card);
      border-radius: 16px;
      padding: 12px 16px;
      line-height: 1.6;
      font-size: 15px;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.has-table { white-space: normal; padding: 8px; }
    .bubble.has-card { white-space: normal; padding: 0; background: transparent; }
    .intent-card {
      width: min(420px, 100%);
      background: var(--ai-card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .intent-card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--title);
    }
    .intent-card-body {
      font-size: 14px;
      font-weight: 500;
      color: var(--ai-desc);
      line-height: 1.6;
    }
    .intent-card-body strong { color: var(--text); font-weight: 600; }
    .intent-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .intent-chip {
      font-size: 13px;
      color: var(--icon-blue);
      background: #fff;
      border: 1px solid #C4D5FD;
      border-radius: 8px;
      padding: 6px 10px;
    }
    .intent-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .intent-list li {
      background: #fff;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      color: var(--text);
    }
    .intent-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .intent-actions button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      min-height: 36px;
      padding: 8px 16px;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .intent-actions button.primary {
      background: var(--brand);
      color: #fff;
    }
    .intent-actions button.primary:disabled {
      background: var(--disabled);
      cursor: not-allowed;
    }
    .intent-actions button.ghost {
      background: #fff;
      color: var(--text-2);
      border: 1px solid var(--card-border);
    }
    .intent-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--orange);
      background: #fff;
      border: 1px solid var(--orange-border);
      border-radius: 8px;
      padding: 4px 8px;
      width: fit-content;
    }
    .intent-kv {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 6px 10px;
      font-size: 13px;
    }
    .intent-kv dt { color: var(--text-2); }
    .intent-kv dd { color: var(--text); margin: 0; word-break: break-word; }
    .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      line-height: 1.4;
      background: #fff;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
    }
    .info-table th,
    .info-table td {
      border: 1px solid var(--split);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }
    .info-table th {
      width: 32%;
      font-weight: 600;
      color: var(--text-2);
      background: var(--ai-card);
      white-space: nowrap;
    }
    .info-table td {
      color: var(--text);
      font-weight: 400;
      word-break: break-all;
    }
    .msg.user .bubble {
      background: var(--brand-soft);
      color: var(--text);
      border-radius: 16px 16px 4px 16px;
    }
    .src-block { margin-top: 8px; }
    .src-toggle {
      appearance: none; border: 1px solid var(--card-border); background: #fff;
      border-radius: 8px; padding: 6px 10px; cursor: pointer;
      font: inherit; font-size: 13px; color: var(--ai-desc);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .src-toggle:hover { border-color: #C4D5FD; color: var(--brand); }
    .src-panel { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
    .src-panel[hidden], .src-panel.is-collapsed { display: none !important; }
    .src-item {
      background: #fff; border: 1px solid var(--card-border); border-radius: 12px;
      padding: 10px 12px;
    }
    .src-meta { font-size: 13px; color: var(--icon-blue); font-weight: 500; margin-bottom: 4px; }
    .src-body { font-size: 13px; color: var(--text-2); line-height: 1.45; white-space: pre-wrap; }
    .composer-box {
      flex-shrink: 0;
      width: 100%;
      background: #fff;
      border: 1px solid var(--border);
      border-bottom: 0;
      border-radius: 28px 28px 0 0;
      padding: 10px 16px 12px;
    }
    .action-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
      width: min(390px, 100%);
    }
    .history-icon-btn {
      appearance: none;
      width: 34px; height: 34px; min-width: 34px;
      border-radius: 999px;
      border: 0;
      background: var(--brand-soft);
      color: var(--icon-blue);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .history-icon-btn:hover { background: var(--icon-bg); }
    .history-icon-btn[aria-expanded="true"] { background: var(--icon-bg); }
    .history-icon-btn svg { width: 16px; height: 16px; }
    .new-chat-btn {
      appearance: none;
      height: 32px;
      border: 0;
      border-radius: 999px;
      padding: 0 14px;
      background: var(--brand);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .new-chat-btn:hover { filter: brightness(1.05); }
    .new-chat-btn:active { transform: scale(0.98); }
    .quick-q {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 8px;
    }
    .quick-q button {
      appearance: none;
      border: 1px solid var(--card-border);
      background: #fff;
      border-radius: 8px;
      padding: 4px 8px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      color: var(--ai-desc);
      text-align: left;
      max-width: 100%;
    }
    .quick-q button:hover {
      border-color: #C4D5FD;
      color: var(--brand);
      background: var(--brand-soft);
    }
    .img-previews {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 8px;
    }
    .img-previews[hidden] { display: none !important; }
    .img-thumb {
      position: relative; width: 72px; height: 72px; border-radius: 12px;
      overflow: hidden; border: 1px solid var(--card-border); background: var(--ai-card);
    }
    .img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .img-thumb button {
      position: absolute; top: 4px; right: 4px; width: 20px; height: 20px;
      border: 0; border-radius: 50%; background: rgba(35,39,46,0.65); color: #fff;
      font-size: 12px; line-height: 1; cursor: pointer; padding: 0;
    }
    .composer {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .composer input[type="text"] {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 0;
      font: inherit;
      font-size: 16px;
      color: var(--text);
      outline: none;
      line-height: 1.4;
      min-height: 24px;
    }
    .composer input[type="text"]::placeholder { color: var(--placeholder); }
    .composer-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .composer .common-menu { position: relative; flex-shrink: 0; }
    .composer button.common-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--common);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 4px 2px;
      min-height: 36px;
      cursor: pointer;
      white-space: nowrap;
    }
    .composer button.common-btn:hover { color: var(--brand); }
    .composer .common-panel {
      position: absolute; left: 0; bottom: calc(100% + 6px);
      min-width: 140px; padding: 6px;
      background: #fff; border: 1px solid var(--card-border); border-radius: 12px;
      display: none; z-index: 6;
    }
    .composer .common-menu.open .common-panel { display: block; }
    .composer .common-panel button.upload-btn {
      width: 100%;
      appearance: none;
      background: #fff;
      color: var(--text);
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      text-align: left;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .composer .common-panel button.upload-btn:hover {
      background: var(--brand-soft);
      color: var(--brand);
    }
    .composer-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .composer button.mic-btn {
      appearance: none;
      width: 40px; height: 40px; min-width: 40px;
      border: 0; border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      padding: 0;
    }
    .composer button.mic-btn:hover { filter: brightness(0.98); }
    .composer button.mic-btn.listening {
      background: #FEE2E2;
      color: #DC2626;
      animation: mic-pulse 1.2s ease-in-out infinite;
    }
    .composer button.mic-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: none;
    }
    .composer button.mic-btn svg { width: 18px; height: 18px; display: block; }
    .composer button.send-btn {
      appearance: none;
      width: 40px; height: 40px; min-width: 40px;
      border: 0; border-radius: 999px;
      background: var(--brand);
      color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      padding: 0;
    }
    .composer button.send-btn:hover { filter: brightness(1.05); }
    .composer button.send-btn:disabled {
      background: var(--disabled);
      cursor: not-allowed;
      filter: none;
    }
    .composer button.send-btn svg { width: 18px; height: 18px; display: block; }
    .voice-status {
      font-size: 12px;
      color: var(--hint);
      min-height: 16px;
      line-height: 16px;
      padding: 0 2px;
    }
    .voice-status.active { color: #DC2626; }
    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.35); }
      50% { box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); }
    }
    .composer-box:focus-within {
      box-shadow: inset 0 0 0 1px rgba(0, 71, 234, 0.18);
    }
    .user-imgs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .user-imgs img {
      width: 88px; height: 88px; object-fit: cover; border-radius: 8px;
      border: 1px solid var(--card-border);
    }
    .ticket-board { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
    .ticket-card {
      background: #fff; border: 1px solid var(--card-border); border-radius: 12px;
      padding: 8px;
    }
    .ticket-card h4 {
      font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text);
      display: flex; align-items: center; gap: 8px;
    }
    .ticket-card h4 img {
      width: 40px; height: 40px; object-fit: cover; border-radius: 4px; border: 1px solid var(--card-border);
    }
    .ticket-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px;
    }
    .ticket-grid label {
      display: flex; flex-direction: column; gap: 4px;
      font-size: 13px; color: var(--text-2);
    }
    .ticket-grid label.full { grid-column: 1 / -1; }
    .ticket-grid input, .ticket-grid select {
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; font: inherit; font-size: 14px; color: var(--text);
      background: #fff;
    }
    .ticket-actions { margin-top: 10px; display: flex; gap: 8px; }
    .ticket-actions button {
      appearance: none; border: 1px solid var(--card-border); background: #fff;
      border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 13px;
      cursor: pointer; color: var(--text-2);
    }
    .ticket-actions button.primary {
      background: var(--brand); color: #fff; border-color: var(--brand);
      border-radius: 999px; min-height: 36px; padding: 8px 16px;
    }
    .ticket-actions button.primary:disabled { background: var(--disabled); border-color: var(--disabled); }
    .typing {
      display: flex; gap: 6px; padding: 12px 16px;
      background: var(--ai-card); border-radius: 16px; align-self: flex-start;
    }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--icon-blue); animation: blink 1.1s infinite; display: block; }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; transform: translateY(-2px); }
    }

    .history-mask {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.46);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 8;
    }
    .chat-card.history-open .history-mask {
      opacity: 1;
      pointer-events: auto;
    }
    .history-rail {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: min(322px, 82%);
      background: #fff;
      z-index: 9;
      display: flex;
      flex-direction: column;
      transform: translateX(-105%);
      transition: transform 0.22s ease;
      border-right: 1px solid var(--border);
    }
    .chat-card.history-open .history-rail { transform: translateX(0); }
    .history-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
    }
    .history-head {
      flex-shrink: 0;
      padding: 16px 16px 8px;
      font-size: 14px;
      font-weight: 400;
      color: var(--placeholder);
    }
    .history-list {
      flex: 1; min-height: 0; overflow-y: auto; padding: 8px 12px 16px;
      display: flex; flex-direction: column; gap: 0;
    }
    .history-item {
      appearance: none; border: 0; background: transparent;
      border-radius: 8px; padding: 8px 10px; text-align: left; cursor: pointer;
      font: inherit; font-size: 14px; color: var(--text); width: 100%;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .history-item:hover { background: var(--ai-card); }
    .history-item .meta { display: block; color: var(--hint); font-size: 13px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-empty { font-size: 14px; color: var(--placeholder); padding: 8px 10px; }

    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; height: auto; min-height: 0; }
      .chat-stage { height: min(82vh, 800px); max-height: min(82vh, 800px); }
      .chat-card { height: auto; max-height: none; width: 100%; }
      .welcome-card { width: 100%; }
      .page { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <h1>湘财晓助 | 财务智能办公助手</h1>
    </div>

    <div class="layout">
      <div class="chat-stage">
        <section class="chat-card" id="chatCard">
          <div class="chat-workspace">
            <div class="chat-body">
              <div class="history-mask" id="historyMask" hidden></div>
              <aside class="history-rail" id="historyRail" aria-hidden="true">
                <div class="history-panel" id="historyPanel">
                  <div class="history-head">30天内的对话历史在这里</div>
                  <div class="history-list" id="historyList"></div>
                </div>
              </aside>

  const WEEKDAY_LABEL = { 0: "日", 1: "一", 2: "二", 3: "三", 4: "四", 5: "五", 6: "六" };
  const WEEKDAY_CHAR = { 日: 0, 天: 0, 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6 };

  function pad2(n) {
    return String(n).padStart(2, "0");
  }

  function formatTripDate(d) {
    const wd = WEEKDAY_LABEL[d.getDay()] || "";
    return pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + "（周" + wd + "）";
  }

  function startOfWeekMonday(base) {
    const d = new Date(base);
    d.setHours(12, 0, 0, 0);
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d;
  }

  function dateOnWeek(monday, weekday) {
    const d = new Date(monday);
    const add = weekday === 0 ? 6 : weekday - 1;
    d.setDate(monday.getDate() + add);
    return d;
  }

  function resolveWeekdayToken(token, baseDate) {
    const m = String(token || "").match(/(下|本)?周([一二三四五六日天])/);
    if (!m) return null;
    const prefix = m[1] || "";
    const weekday = WEEKDAY_CHAR[m[2]];
    if (weekday == null) return null;
    const base = new Date(baseDate || Date.now());
    base.setHours(12, 0, 0, 0);
    let monday = startOfWeekMonday(base);
    if (prefix === "下") {
      monday = new Date(monday);
      monday.setDate(monday.getDate() + 7);
    } else if (!prefix) {
      const candidate = dateOnWeek(monday, weekday);
      if (candidate.getTime() < base.getTime() - 12 * 3600 * 1000) {
        monday = new Date(monday);
        monday.setDate(monday.getDate() + 7);
      }
    }
    return dateOnWeek(monday, weekday);
  }

  function extractTripReason(text) {
    if (/设备检|检修/.test(text)) return "设备检修";
    if (/对接/.test(text)) {
      const m = text.match(/对接([^，,。；;\s]+)/);
      if (m) {
        const raw = m[1];
        if (/设备检|检修/.test(raw)) return "设备检修";
        return raw;
      }
    }
    if (/会议|拜访|培训|验收|调研/.test(text)) {
      const m = text.match(/(会议|拜访|培训|验收|调研)[^，,。；;\s]*/);
      if (m) return m[0];
    }
    return "出差对接";
  }

  function parseTripAssistIntent(question) {
    const q = String(question || "").trim();
    if (!q) return null;
    const destMatch = q.match(/去([\u4e00-\u9fa5A-Za-z0-9]{2,12})/);
    if (!destMatch) return null;
    if (!/周[一二三四五六日天]/.test(q)) return null;
    if (!/(回|返回|返程|回来)/.test(q) && !(/周[一二三四五六日天].*周[一二三四五六日天]/.test(q))) return null;

    const startTokenMatch = q.match(/(下|本)?周[一二三四五六日天]/);
    const endTokenMatch = q.match(/(?:，|,|。)?(?:于)?((?:下|本)?周[一二三四五六日天])\s*(?:回|返回|返程|回来)/) ||
      q.match(/((?:下|本)?周[一二三四五六日天])(?!.*周[一二三四五六日天])/);

    const startDate = resolveWeekdayToken(startTokenMatch && startTokenMatch[0], new Date());
    let endDate = null;
    if (endTokenMatch) {
      const endTok = endTokenMatch[1] || endTokenMatch[0];
      if (/^周/.test(endTok) && startDate) {
        endDate = dateOnWeek(startOfWeekMonday(startDate), WEEKDAY_CHAR[endTok.replace(/^周/, "")] );
      } else {
        endDate = resolveWeekdayToken(endTok, startDate || new Date());
      }
    }
    if (!startDate || !endDate) return null;
    if (endDate.getTime() < startDate.getTime()) {
      endDate = new Date(endDate);
      endDate.setDate(endDate.getDate() + 7);
    }

    const nights = Math.max(0, Math.round((endDate - startDate) / (24 * 3600 * 1000)));
    const destination = destMatch[1].replace(/对接.*/, "").replace(/市$/, "") || destMatch[1];
    return {
      destination: destination,
      startDate: startDate,
      endDate: endDate,
      nights: nights,
      reason: extractTripReason(q),
      origin: "湘潭",
      railClass: "高铁二等座",
      hotelRate: 400
    };
  }

  function readConfig() {

  function writeConfig(partial) {
    const cur = readConfig();

    if (partial && partial.apiBase != null) {

  async function kbFetch(path, options) {
    const cfg = readConfig();
    const base = normalizeBase(cfg.apiBase);
    if (!base) throw new Error("请先配置 API Base");
    const res = await fetch(base + path, {
      ...options,
      headers: {
        Authorization: "Bearer " + (cfg.apiKey || DEFAULT_API_KEY),
        "Content-Type": "application/json",
        ...(options && options.headers)
      }
    });
    const text = await res.text();
    let data = null;
    try {
      data = text ? JSON.parse(text) : null;
    } catch (_) {
      data = { raw: text };
    }
    if (!res.ok) {
      const msg = (data && (data.message || data.errorMsg || data.error || data.detail)) || text || res.statusText;
      throw new Error("HTTP " + res.status + " · " + msg);
    }
    return data;
  }

  async function retrieve(query, selectedIds) {
    const cfg = readConfig();
    const ids = selectedIds && selectedIds.length ? selectedIds : cfg.selectedIds;

    const threshold = Number.isFinite(scoreThreshold) ? scoreThreshold : 0;

        method: "POST",

          top_k: topK,

        })
      });
      return Array.isArray(data && data.result) ? data.result : [];
    }

    const qs = new URLSearchParams();
    ids.forEach((id) => qs.append("dataset_ids", id));
    qs.set("query", query);
    qs.set("retrieval_method", method);
    qs.set("top_k", String(topK));
    qs.set("score_threshold", String(threshold));
    const data = await kbFetch("/knowledge/datasets/retrieval?" + qs.toString(), { method: "GET" });
    return Array.isArray(data && data.result) ? data.result : [];
  }

  async function streamLLM(messages, onDelta, signal) {
    const response = await fetch(LLM_API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + LLM_API_KEY
      },
      body: JSON.stringify({ model: LLM_MODEL, messages, stream: true }),
      signal
    });
    if (!response.ok) {
      const errText = await response.text();
      throw new Error("LLM HTTP " + response.status + " · " + errText.slice(0, 240));
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let full = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || !trimmed.startsWith("data:")) continue;
        const data = trimmed.slice(5).trim();
        if (data === "[DONE]") continue;
        try {
          const parsed = JSON.parse(data);
          const delta =
            parsed.choices && parsed.choices[0] && parsed.choices[0].delta && parsed.choices[0].delta.content;
          if (delta) {
            full += delta;
            onDelta(full, delta);
          }
        } catch (_) {}
      }
    }
    return full;
  }

  async function completeLLM(messages, signal) {
    const response = await fetch(LLM_API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + LLM_API_KEY
      },
      body: JSON.stringify({ model: LLM_MODEL, messages, stream: false }),
      signal
    });
    const text = await response.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = { raw: text }; }
    if (!response.ok) {
      const msg = (data && (data.message || data.error || data.detail)) || text || response.statusText;
      throw new Error("LLM HTTP " + response.status + " · " + String(msg).slice(0, 240));
    }
    return (data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "";
  }

  function parseJsonLoose(raw) {
    const text = String(raw || "").trim();
    if (!text) return null;
    try { return JSON.parse(text); } catch (_) {}
    const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fenced) {
      try { return JSON.parse(fenced[1].trim()); } catch (_) {}
    }
    const start = text.indexOf("{");
    const end = text.lastIndexOf("}");
    if (start >= 0 && end > start) {
      try { return JSON.parse(text.slice(start, end + 1)); } catch (_) {}
    }
    return null;
  }

  async function extractTicketFromImage(dataUrl, signal) {
    const prompt =
      "你是财务票据 OCR 助手。请识别图片中的文字，并提取差旅/交通票据关键字段。" +
      "只返回一个 JSON 对象，不要 Markdown，不要解释。字段如下：" +
      '{"departureCity":"出发城市","departureTime":"出发时间","arrivalCity":"到达城市","arrivalTime":"到达时间","amount":"金额数字字符串","rawText":"图片可见文字摘要"}。' +
      "无法识别的字段填空字符串。金额只保留数字和小数点。";
    const content = await completeLLM(
      [
        {
          role: "user",
          content: [
            { type: "text", text: prompt },
            { type: "image_url", image_url: { url: dataUrl } }
          ]
        }
      ],
      signal
    );
    const parsed = parseJsonLoose(content) || {};
    return {
      departureCity: String(parsed.departureCity || "").trim(),
      departureTime: String(parsed.departureTime || "").trim(),
      arrivalCity: String(parsed.arrivalCity || "").trim(),
      arrivalTime: String(parsed.arrivalTime || "").trim(),
      amount: String(parsed.amount || "").trim(),
      rawText: String(parsed.rawText || "").trim()
    };
  }

  function polishAnswer(text) {
    var s = String(text || "");
    s = s.replace(/\*\*/g, "");
    s = s.replace(/__/g, "");
    s = s.replace(/`+/g, "");
    s = s.replace(/^#{1,6}\s+/gm, "");
    s = s.replace(/^\s*>\s?/gm, "");
    s = s.replace(/^\s*[-*+]\s+/gm, "• ");
    s = s.replace(/（[^）]*依据[^）]*）/g, "");
    s = s.replace(/\([^)]*依据[^)]*\)/g, "");
    s = s.replace(/依据[：:][^\n。；;]*[。；;]?/g, "");
    s = s.replace(/（[^）]*(?:第\s*\d+\s*条|附录\s*[A-Za-z0-9]+)[^）]*）/g, "");
    s = s.replace(/\([^)]*(?:第\s*\d+\s*条|附录\s*[A-Za-z0-9]+)[^)]*\)/g, "");
    s = s.replace(/（\s*见?(?:制度|办法|规定|附录|附件)[^）]*）/g, "");
    s = s.replace(/(^|[\s，、；;])\*([^*\n]+)\*(?=[\s，、。；;]|$)/g, "$1$2");
    s = s.replace(/[ \t]+\n/g, "\n");
    s = s.replace(/\n{3,}/g, "\n\n");
    s = s.replace(/[ \t]{2,}/g, " ");
    return s.trim();
  }

        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        input: spoken,
        voice: voice,
        response_format: "mp3"
      })
    });
    var buf = await res.arrayBuffer();
    var head = "";
    try {
      head = new TextDecoder("utf-8").decode(buf.slice(0, Math.min(buf.byteLength, 80)));
    } catch (e) {}
    if (!res.ok || (head && head.charAt(0) === "{")) {
      var msg = "语音合成失败";
      try {
        var err = JSON.parse(new TextDecoder("utf-8").decode(buf));

    var url = URL.createObjectURL(blob);
    var audio = new Audio(url);

    function handleDemoFollowup(q) {
      if (state.demoMode === "tripApply") {
        const trip = window.Caizhi.parseTripAssistIntent(q);
        if (trip) {
          renderTripAssistFlow(trip);
          state.demoMode = null;
          el.input.placeholder = "有什么可以帮到你的";
          return true;
        }
        if (/去.+周.+回/.test(q) || (/长沙/.test(q) && /周/.test(q))) {
          const fallback = window.Caizhi.parseTripAssistIntent(DEMO_SAMPLES.tripApply.utterance) || buildFallbackTrip();
          renderTripAssistFlow(fallback);
          state.demoMode = null;
          el.input.placeholder = "有什么可以帮到你的";
          return true;
        }
        addMsg("bot", "还差一些行程信息。请补充目的地、出发和返回时间，例如：下周二去长沙对接设备检修，周四回。");
        return true;
      }
      if (state.demoMode === "tripBook") {
        const isAdjust = /改成|便宜|上午|调整|换成|不要/.test(q);
        if (isAdjust) {
          addMsg("bot", "已按您的要求调整，以下是重新匹配的方案，请确认。");
        }
        const sample = Object.assign({}, DEMO_SAMPLES.tripBook, {
          utterance: q,
          options: isAdjust
            ? [
                { id: "rail_go", label: "去程 G1240 湘潭→长沙 09:18-10:02 二等座 ¥128" },
                { id: "rail_back", label: "返程 G1291 长沙→湘潭 18:10-18:55 二等座 ¥128" },
                { id: "hotel", label: "火车站附近经济型酒店 ¥329/晚 × 2晚（未超标）" }
              ]
            : DEMO_SAMPLES.tripBook.options
        });
        renderTripBookFlow(sample);
        return true;
      }
      if (state.demoMode === "expense" || state.demoMode === "expenseStatus" || state.expenseClaim) {
        if (/到账|进度|状态|查询/.test(q)) {
          showExpenseStatus(true);
          return true;
        }
        if (state.demoMode === "expense") {
          renderExpenseClaimFlow(DEMO_SAMPLES.expense);
          el.input.placeholder = "有什么可以帮到你的";
          return true;
        }
      }
      return false;
    }

    function readFileAsDataUrl(file) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onload = function () { resolve(String(reader.result || "")); };
        reader.onerror = function () { reject(new Error("读取图片失败：" + (file && file.name ? file.name : ""))); };
        reader.readAsDataURL(file);
      });
    }

    async function onFilesSelected(fileList) {
      const files = Array.from(fileList || []).filter(function (f) {
        return f && String(f.type || "").indexOf("image/") === 0;
      });

      const loaded = await Promise.all(files.map(async function (file) {
        const dataUrl = await readFileAsDataUrl(file);
        return { name: file.name || "image", dataUrl: dataUrl };
      }));
      state.pendingImages = state.pendingImages.concat(loaded).slice(0, 12);
      renderPendingPreviews();
      el.fileImages.value = "";
    }

    async function askImages(note) {
      if (!state.pendingImages.length || state.busy) return;
      const images = state.pendingImages.slice();
      const remark = String(note || "").trim();
      state.pendingImages = [];
      renderPendingPreviews();
      state.busy = true;
      el.send.disabled = true;
      el.btnUpload.disabled = true;

      const user = addMsg("user", remark || ("已上传 " + images.length + " 张票据图片，请识别并生成填报表单。"));
      const gallery = document.createElement("div");
      gallery.className = "user-imgs";
      images.forEach(function (img) {
        const node = document.createElement("img");
        node.src = img.dataUrl;
        node.alt = img.name;
        gallery.appendChild(node);
      });
      user.bubble.appendChild(gallery);

      showTyping();
      state.abort = new AbortController();
      try {
        const bot = addMsg("bot", "正在解析图片文字并提取差旅字段…");
        hideTyping();
        const tickets = [];
        for (let i = 0; i < images.length; i++) {
          bot.body.textContent = "正在识别第 " + (i + 1) + "/" + images.length + " 张图片…";
          const extracted = await window.Caizhi.extractTicketFromImage(images[i].dataUrl, state.abort.signal);
          tickets.push({
            name: images[i].name,
            dataUrl: images[i].dataUrl,
            tripName: window.Caizhi.randomTripApplicationName(),
            departureCity: extracted.departureCity,
            departureTime: extracted.departureTime,
            arrivalCity: extracted.arrivalCity,
            arrivalTime: extracted.arrivalTime,
            amount: extracted.amount,
            rawText: extracted.rawText
          });
        }
        bot.body.textContent = "已完成 " + tickets.length + " 张图片识别。请核对下方表单。";
        renderTicketForms(bot.stack, tickets);
        el.chat.scrollTop = el.chat.scrollHeight;
      } catch (err) {
        hideTyping();
        addMsg("bot", "图片识别失败：" + (err.message || err));
      } finally {
        state.busy = false;
        state.abort = null;
        el.send.disabled = false;
        el.btnUpload.disabled = false;
        el.input.focus();

    async function ask(question) {
      if (state.pendingImages.length) {
        await askImages(question);
        return;
      }
      const q = String(question || "").trim();
      if (!q || state.busy) return;
      const fromVoice = !!state.voiceAsked;
      state.voiceAsked = false;
      state.busy = true;
      el.send.disabled = true;
      if (el.btnMic) el.btnMic.disabled = true;
      window.Caizhi.stopListenHubSpeech();
      addMsg("user", q);
      el.input.value = "";
      showTyping();
      state.abort = new AbortController();
      var speakText = "";
      try {
        if (handleDemoFollowup(q)) {
          hideTyping();
          speakText = "已按您的说明继续处理。";
          return;
        }
        const deniedRanks = window.Caizhi.detectRestrictedRankAsk(q);
        if (deniedRanks.length) {
          hideTyping();
          speakText = window.Caizhi.buildRankDeniedReply(deniedRanks);
          addMsg("bot", speakText);
          return;
        }
        const trip = window.Caizhi.parseTripAssistIntent(q);
        if (trip) {
          hideTyping();
          renderTripAssistFlow(trip);
          state.demoMode = null;
          speakText = "已为您生成差旅辅助卡片，请确认行程后提交。";
          return;
        }
        persistForm();
        const results = await window.Caizhi.retrieve(q, Array.from(state.selectedIds));
        const sources = results.slice(0, 5);
        hideTyping();
        const bot = addMsg("bot", results.length ? "正在根据知识库生成回答…" : "未检索到相关片段，尝试通则作答…");
        const answer = await window.Caizhi.streamLLM(
          [
            { role: "system", content: window.Caizhi.LLM_SYSTEM },
            {
              role: "user",
              content: window.Caizhi.buildAskUserPrompt(q, window.Caizhi.buildContext(results))
            }
          ],
          (full) => {
            bot.body.textContent = window.Caizhi.polishAnswer(full);
            el.chat.scrollTop = el.chat.scrollHeight;
          },
          state.abort.signal
        );
        if (!answer) bot.body.textContent = "模型未返回内容，请稍后重试。";
        else bot.body.textContent = window.Caizhi.polishAnswer(answer);
        speakText = bot.body.textContent || "";
        window.Caizhi.renderCollapsedSources(bot.stack, sources);
        el.chat.scrollTop = el.chat.scrollHeight;
      } catch (err) {
        hideTyping();
        speakText = "问答失败：" + (err.message || err);
        addMsg("bot", speakText);
      } finally {
        state.busy = false;
        state.abort = null;
        el.send.disabled = false;
        if (el.btnMic) el.btnMic.disabled = false;
        el.input.focus();
        if (fromVoice && speakText) {
          window.Caizhi.speakWithListenHub(speakText).catch(function () {});
        }
      }
    }

    function setVoiceStatus(text, active) {
      if (!el.voiceStatus) return;
      el.voiceStatus.textContent = text || "";
      el.voiceStatus.classList.toggle("active", !!active);
    }

    function setMicListening(on) {
      state.voiceListening = !!on;
      if (!el.btnMic) return;
      el.btnMic.classList.toggle("listening", !!on);
      el.btnMic.setAttribute("aria-pressed", on ? "true" : "false");
      el.btnMic.title = on ? "停止语音输入" : "语音输入";
    }

    function stopVoiceInput() {
      if (state.recognition) {
        try { state.recognition.stop(); } catch (e) {}
      }
      setMicListening(false);
      setVoiceStatus("", false);
    }

    function startVoiceInput() {
      if (state.busy) return;
      if (state.voiceListening) {
        stopVoiceInput();
        return;
      }
      window.Caizhi.stopListenHubSpeech();
      state.voiceFinal = "";
      if (!state.recognition) {
        state.recognition = window.Caizhi.createSpeechRecognizer({
          onStart: function () {
            setMicListening(true);
            setVoiceStatus("正在聆听，请说话…", true);
          },
          onResult: function (payload) {
            var text = payload.transcript || "";
            if (payload.finalText) state.voiceFinal = String(payload.finalText).trim();
            if (text) el.input.value = text;
            if (payload.finalText) setVoiceStatus("识别完成，正在发送…", true);
            else setVoiceStatus("正在聆听：" + (payload.interim || "…"), true);
          },
          onError: function (event) {
            var code = event && event.error ? event.error : "";
            var tip = "语音识别失败，请重试";
            if (code === "not-allowed") tip = "未获得麦克风权限，请在浏览器中允许后重试";
            else if (code === "no-speech") tip = "未检测到语音，请靠近麦克风再说一次";
            else if (code === "audio-capture") tip = "无法访问麦克风，请检查设备";
            else if (code === "network") tip = "语音识别网络异常，请稍后重试";
            setVoiceStatus(tip, false);
            setMicListening(false);
          },
          onEnd: function () {
            setMicListening(false);
            var q = (state.voiceFinal || el.input.value || "").trim();
            state.voiceFinal = "";
            if (!q) {
              if (el.voiceStatus && /正在聆听/.test(el.voiceStatus.textContent || "")) {
                setVoiceStatus("未识别到有效内容", false);
              }
              return;
            }
            el.input.value = q;
            state.voiceAsked = true;
            setVoiceStatus("", false);
            ask(q);
          }
        });
      }
      if (!state.recognition) {
        setVoiceStatus("当前浏览器不支持语音识别，请改用文字输入", false);
        return;
      }
      try {
        state.recognition.start();
      } catch (err) {
        setVoiceStatus("无法启动语音识别：" + (err.message || err), false);
        setMicListening(false);
      }
    }


    function loadHistory() {
      try {
        const arr = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        return [];
      }
    }

    function saveHistory(list) {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 30)));
    }

    function seedPresetHistory() {
      const list = loadHistory();
      const byId = {};
      list.forEach(function (item) {
        if (item && item.id) byId[item.id] = true;
      });
      let changed = false;
      // 预置样例固定置顶，缺失则插入
      const merged = [];
      PRESET_HISTORY.forEach(function (preset) {
        merged.push(preset);
        if (!byId[preset.id]) changed = true;
      });
      list.forEach(function (item) {
        if (!item || !item.id) return;
        if (String(item.id).indexOf("preset-") === 0) return;
        merged.push(item);
      });
      if (changed || !localStorage.getItem(HISTORY_SEED_KEY)) {
        saveHistory(merged.slice(0, 30));
        localStorage.setItem(HISTORY_SEED_KEY, "1");
      } else {
        // 仍确保 preset 在最前
        saveHistory(merged.slice(0, 30));
      }
    }

    function snapshotMessages() {
      const nodes = el.chat.querySelectorAll(".msg");
      const msgs = [];
      nodes.forEach(function (node) {
        const role = node.classList.contains("user") ? "user" : "bot";
        if (node.querySelector(".info-table")) {
          msgs.push({ role: role, text: INVOICE_MARKER });
          return;
        }
        const body = node.querySelector(".body");
        const text = body ? body.textContent : "";
        if (!text) return;
        msgs.push({ role: role, text: text });
      });
      return msgs;
    }

    function hasUserMessage(msgs) {
      return (msgs || []).some(function (m) { return m.role === "user"; });
    }

    function renderHistoryList() {
      const list = loadHistory();
      el.historyList.innerHTML = "";
      if (!list.length) {
        el.historyList.innerHTML = '<div class="history-empty">暂无历史对话</div>';
        return;
      }
      list.forEach(function (item) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "history-item";
        const title = document.createElement("span");
        title.textContent = item.title || "未命名对话";
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = item.time || "";
        btn.appendChild(title);
        btn.appendChild(meta);
        btn.addEventListener("click", function () {
          restoreConversation(item);
        });
        el.historyList.appendChild(btn);
      });
    }

    function archiveCurrentConversation() {
      const msgs = snapshotMessages();
      if (!hasUserMessage(msgs)) return;
      const firstUser = msgs.find(function (m) { return m.role === "user"; });
      const title = String(firstUser && firstUser.text || "对话").replace(/\s+/g, " ").trim().slice(0, 24);
      const now = new Date();
      const time = now.toLocaleString("zh-CN", {
        month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
      });
      const list = loadHistory();
      list.unshift({
        id: String(Date.now()),
        title: title || "对话",
        time: time,
        messages: msgs
      });
      saveHistory(list);
      renderHistoryList();
    }

    function startNewConversation() {
      if (state.busy) return;
      archiveCurrentConversation();
      el.chat.innerHTML = "";
      state.pendingImages = [];
      state.demoMode = null;
      state.expenseClaim = null;
      renderPendingPreviews();
      setHistoryOpen(false);
      renderWelcome();
      el.input.focus();
    }

    function restoreConversation(item) {
      if (state.busy) return;
      archiveCurrentConversation();
      el.chat.innerHTML = "";
      state.pendingImages = [];
      renderPendingPreviews();
      (item.messages || []).forEach(function (m) {
        if (m.text === INVOICE_MARKER) {
          const bot = addMsg("bot", "");
          appendInvoiceTable(bot.bubble);
          return;
        }
        addMsg(m.role === "user" ? "user" : "bot", m.text || "");
      });
      setHistoryOpen(false);
      el.chat.scrollTop = el.chat.scrollHeight;
    }

    function toggleHistory() {
      setHistoryOpen(!state.historyOpen);
    }

    function renderQuickQ() {
      el.quickQ.innerHTML = "";
      window.Caizhi.SUGGESTIONS.forEach((q) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = q;
        b.title = q;
        b.addEventListener("click", () => ask(q));
        el.quickQ.appendChild(b);
      });
    }

    el.btnCommon.addEventListener("click", function (e) {
      e.stopPropagation();
      const open = !el.commonMenu.classList.contains("open");
      el.commonMenu.classList.toggle("open", open);
      el.btnCommon.setAttribute("aria-expanded", open ? "true" : "false");
    });
    el.btnUpload.addEventListener("click", function () {
      closeCommonMenu();
      el.fileImages.click();
    });
    el.btnTripApply.addEventListener("click", function () {
      openDemoEntry("tripApply");
    });
    el.btnTripBook.addEventListener("click", function () {
      openDemoEntry("tripBook");
    });
    el.btnExpense.addEventListener("click", function () {
      openDemoEntry("expense");
    });
    el.btnInvoice.addEventListener("click", function () {
      showInvoiceInfo();
    });
    document.addEventListener("click", function (e) {
      if (!el.commonMenu.contains(e.target)) {
        el.commonMenu.classList.remove("open");
        el.btnCommon.setAttribute("aria-expanded", "false");
      }
    });
    el.fileImages.addEventListener("change", function () {
      onFilesSelected(el.fileImages.files).catch(function (err) {
        addMsg("bot", "上传失败：" + (err.message || err));
      });
    });
    el.form.addEventListener("submit", (e) => {
      e.preventDefault();
      stopVoiceInput();
      const q = el.input.value;
      el.input.value = "";
      ask(q);
    });
    if (el.btnMic) {
      el.btnMic.addEventListener("click", function () {
        startVoiceInput();
      });
    }


    el.btnNewChat.addEventListener("click", startNewConversation);
    el.btnHistory.addEventListener("click", function (e) {
      e.stopPropagation();
      toggleHistory();
    });
    if (el.historyMask) {
      el.historyMask.addEventListener("click", function () {
        setHistoryOpen(false);
      });
    }
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && state.historyOpen) setHistoryOpen(false);
    });

    loadForm();
    seedPresetHistory();
    renderQuickQ();
    renderHistoryList();
    renderWelcome();
    connect();
  
</script>
</body>
</html>
