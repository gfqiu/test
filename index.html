<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>湘财晓助 | 财务智能办公助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #4f6ef7;
      --blue-deep: #3b57e0;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --bg: #f3f5f9;
      --card: #fff;
      --navy: #243447;
      --peach: #f8ebe4;
      --shadow: 0 10px 28px rgba(31, 41, 55, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans SC", sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
    }
    .top {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 0.65rem 1.4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .top .crumb strong { color: var(--ink); font-weight: 600; }
    .top-right { display: flex; align-items: center; gap: 0.75rem; }
    .badge {
      background: #fde68a; color: #92400e;
      padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.72rem;
    }
    .avatar {
      display: flex; align-items: center; gap: 0.4rem; color: var(--ink);
    }
    .avatar i {
      width: 1.55rem; height: 1.55rem; border-radius: 50%;
      background: var(--blue); color: #fff; display: inline-flex;
      align-items: center; justify-content: center; font-size: 0.7rem; font-style: normal;
    }
    .page {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 1.35rem 1.25rem 2rem;
    }
    .hero h1 {
      font-size: clamp(1.45rem, 2.4vw, 1.85rem);
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .hero p {
      margin-top: 0.4rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .layout {
      margin-top: 1.15rem;
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 1rem;
      align-items: stretch;
      height: calc(100vh - 150px);
      min-height: 520px;
    }
    .chat-card, .side-card, .cfg-drawer {
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(229, 231, 235, 0.9);
    }
    .chat-card {
      height: 100%;
      max-height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-head {
      padding: 0.9rem 1.1rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 600;
    }
    .chat-head .pill {
      margin-left: auto;
      background: #eef2ff;
      color: var(--blue-deep);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
    }
    .chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
      background: #fcfcfd;
    }
    .msg { max-width: 86%; display: flex; gap: 0.55rem; animation: rise 0.3s ease both; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg .ava {
      width: 2rem; height: 2rem; border-radius: 50%;
      background: var(--blue); color: #fff; display: flex;
      align-items: center; justify-content: center; font-size: 0.75rem; flex-shrink: 0;
    }
    .msg.user .ava { background: #94a3b8; }
    .bubble {
      background: #f3f4f6;
      border-radius: 12px;
      padding: 0.8rem 0.95rem;
      line-height: 1.65;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble { background: #e8eeff; }
    .src-block { margin-top: 0.5rem; }
    .src-toggle {
      appearance: none; border: 1px solid var(--line); background: #fff;
      border-radius: 8px; padding: 0.35rem 0.65rem; cursor: pointer;
      font: inherit; font-size: 0.78rem; color: var(--muted);
      display: inline-flex; align-items: center; gap: 0.35rem;
    }
    .src-panel { margin-top: 0.45rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .src-panel[hidden], .src-panel.is-collapsed { display: none !important; }
    .src-item {
      background: #fff; border: 1px solid var(--line); border-radius: 10px;
      padding: 0.55rem 0.7rem;
    }
    .src-meta { font-size: 0.8rem; color: var(--blue-deep); font-weight: 500; margin-bottom: 0.25rem; }
    .src-body { font-size: 0.78rem; color: var(--muted); line-height: 1.45; white-space: pre-wrap; }
    .composer {
      flex-shrink: 0;
      border-top: 1px solid var(--line);
      padding: 0.85rem 1rem;
      display: flex; gap: 0.55rem; align-items: center;
      background: #fff;
    }
    .composer input {
      flex: 1; border: 1px solid var(--line); border-radius: 999px;
      padding: 0.75rem 1rem; font: inherit; outline: none;
    }
    .composer input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(79,110,247,0.12); }
    .composer button {
      appearance: none; border: 0; background: var(--blue); color: #fff;
      border-radius: 10px; padding: 0.7rem 1.1rem; font: inherit; font-weight: 500;
      cursor: pointer;
    }
    .composer button:disabled { opacity: 0.55; cursor: not-allowed; }
    .side { display: flex; flex-direction: column; gap: 0.85rem; min-height: 0; max-height: 100%; overflow-y: auto; }
    .side-card { padding: 0.95rem; }
    .side-card h3 {
      font-size: 0.92rem; margin-bottom: 0.65rem; font-weight: 600;
    }
    .hot-q {
      display: flex; flex-direction: column; gap: 0.45rem;
    }
    .hot-q button {
      appearance: none; text-align: left; border: 1px solid var(--line);
      background: #f8fafc; border-radius: 10px; padding: 0.55rem 0.7rem;
      font: inherit; font-size: 0.82rem; color: var(--ink); cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .hot-q button:hover { background: #eef2ff; border-color: #c7d2fe; }
    .core { background: var(--peach); border-color: transparent; }
    .core ul { padding-left: 1.1rem; font-size: 0.82rem; line-height: 1.7; color: #4b5563; }
    .value {
      background: var(--navy); color: #e5e7eb; border: 0;
    }
    .value h3 { color: #fff; }
    .value p { font-size: 0.82rem; line-height: 1.65; opacity: 0.92; }
    .cfg-drawer {
      padding: 0.75rem 0.85rem;
      opacity: 0.88;
    }
    .cfg-drawer summary {
      cursor: pointer; font-size: 0.78rem; color: var(--muted);
      list-style: none; display: flex; align-items: center; justify-content: space-between;
    }
    .cfg-drawer summary::-webkit-details-marker { display: none; }
    .cfg-body { margin-top: 0.65rem; display: flex; flex-direction: column; gap: 0.45rem; }
    .field label { display: block; font-size: 0.72rem; color: var(--muted); margin-bottom: 0.2rem; }
    .field input, .field select {
      width: 100%; border: 1px solid var(--line); border-radius: 8px;
      padding: 0.4rem 0.5rem; font: inherit; font-size: 0.8rem;
    }
    .cfg-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .cfg-actions button {
      appearance: none; border: 1px solid var(--line); background: #fff;
      border-radius: 8px; padding: 0.35rem 0.55rem; font: inherit; font-size: 0.75rem;
      cursor: pointer;
    }
    .cfg-actions button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .dataset-list { max-height: 160px; overflow: auto; display: flex; flex-direction: column; gap: 0.3rem; }
    .dataset-item {
      text-align: left; border: 1px solid var(--line); background: #fafafa;
      border-radius: 8px; padding: 0.4rem 0.5rem; cursor: pointer; font-size: 0.75rem;
    }
    .dataset-item.active { border-color: var(--blue); background: #eef2ff; }
    .dataset-item strong { display: block; font-size: 0.78rem; }
    .status { font-size: 0.72rem; color: var(--muted); min-height: 1em; }
    .status.ok { color: #059669; }
    .status.err { color: #dc2626; }
    .typing { display: flex; gap: 0.25rem; padding: 0.65rem 0.8rem; background: #f3f4f6; border-radius: 12px; align-self: flex-start; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); animation: blink 1.1s infinite; display: block; }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    .mobile-link {
      display: inline-block; margin-top: 0.55rem; font-size: 0.8rem; color: var(--blue-deep); text-decoration: none;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; transform: translateY(-2px); }
    }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; height: auto; min-height: 0; }
      .chat-card { height: min(70vh, 720px); max-height: 70vh; }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="crumb">湘财财务 AI 平台 / <strong>湘财晓助 · 财务智能办公助手</strong></div>
    <div class="top-right">
      <span class="badge">在线知识库</span>
      <span id="today"></span>
      <div class="avatar"><i>湘</i><span>财务用户</span></div>
    </div>
  </div>

  <div class="page">
    <div class="hero">
      <h1>湘财晓助 | 财务智能办公助手</h1>
      <p>财务知识库标准问答 · 流程指引 · 操作说明 | 知识库文档由企业提供，结构化入库</p>
      <a class="mobile-link" href="mobile.html">打开移动端页面 →</a>
    </div>

    <div class="layout">
      <section class="chat-card">
        <div class="chat-head">
          <span>🤖 智能问答</span>
          <span class="pill" id="kbPill">知识库加载中…</span>
        </div>
        <div class="chat" id="chat" role="log" aria-live="polite"></div>
        <form class="composer" id="form" autocomplete="off">
          <input id="input" type="text" maxlength="800" placeholder="请输入财务制度、流程、操作类问题…" aria-label="问题输入" />

        </form>
      </section>

      <aside class="side">
        <div class="side-card">
          <h3>热门问题</h3>
          <div class="hot-q" id="hot"></div>
        </div>
        <div class="side-card core">
          <h3>三项核心服务</h3>
          <ul>
            <li>标准问答（制度 / 流程）</li>
            <li>流程指引（业务场景逐步说明）</li>
            <li>操作说明（系统填报与单据）</li>
          </ul>
        </div>
        <div class="side-card value">
          <h3>价值</h3>
          <p>减少重复咨询，提升响应效率；答案可追溯到来源文档，权威可核验。</p>
        </div>

        <details class="cfg-drawer" id="cfgDrawer">
          <summary>高级 · 服务对接 / 知识库 <span>⚙</span></summary>
          <div class="cfg-body">
            <div class="field">
              <label>API Base（含 /v1）</label>
              <input id="apiBase" type="text" />
            </div>
            <div class="field">

            <div class="field">
              <label>检索方式</label>
              <select id="method">
                <option value="hybrid_search">混合检索</option>
                <option value="semantic_search">语义检索</option>
                <option value="full_text_search">全文检索</option>
              </select>
            </div>
            <div class="field">
              <label>Top K</label>
              <input id="topK" type="text" />
            </div>
            <div class="field">
              <label>Score 阈值</label>
              <input id="threshold" type="text" />
            </div>
            <div class="cfg-actions">
              <button type="button" class="primary" id="btnConnect">连接</button>
              <button type="button" id="btnSave">保存</button>
            </div>
            <p class="status" id="connStatus"></p>
            <div class="section-label" style="font-size:0.72rem;color:var(--muted);">知识库（点击多选）</div>
            <div class="dataset-list" id="datasetList"></div>
            <p class="status" id="listStatus"></p>
          </div>
        </details>
      </aside>
    </div>
  </div>

  
  
<script>
/* 湘财 · 共享逻辑：知识库检索 + DeepSeek 流式问答；配置经 localStorage 双端同步 */
(function (global) {
  const DEFAULT_API_BASE = "https://agent.unidt.com/v1";
  const DEFAULT_API_KEY = "dataset-adoZr8SvffoDDlAGZibbdAip";
  const STORAGE_BASE = "caizhi_api_base";
  const STORAGE_KEY = "caizhi_api_key";
  const STORAGE_SELECTED = "caizhi_selected_ids";
  const STORAGE_METHOD = "caizhi_method";
  const STORAGE_TOPK = "caizhi_topk";
  const STORAGE_THRESHOLD = "caizhi_threshold";

  const LLM_API_URL = "https://ai-api.unidtai.com/openapi/llm/compatible-mode/v1/chat/completions";
  const LLM_API_KEY = "sk-60569506137942a6a2b18b7aedbef8d1";
  const LLM_MODEL = "deepseek/deepseek-v4-flash-vision-exp";
  const LLM_SYSTEM =
    "你是企业内部财务智能知识助手「湘财」。请严格依据用户提供的知识库检索片段回答；" +
    "若片段不足以回答，请明确说明资料不足，不要编造制度条文。回答简洁、分点，使用中文。" +
    "不要透露底层模型名称。";

  const SUGGESTIONS = [
    "差旅费报销需要哪些票据？",
    "费用报销审批流程是怎样的？",
    "固定资产如何入账与折旧？",
    "预算追加需要什么材料？",
    "增值税专用发票如何认证？"
  ];

  function normalizeBase(raw) {
    let base = String(raw || "").trim().replace(/\/+$/, "");
    if (/^http:\/\/agent\.unidt\.com\b/i.test(base)) base = base.replace(/^http:/i, "https:");
    return base;
  }

  function readConfig() {
    const params = new URLSearchParams(location.search);
    const fromQuery = params.get("base") || params.get("api");
    return {
      apiBase: normalizeBase(fromQuery || localStorage.getItem(STORAGE_BASE) || DEFAULT_API_BASE),
      apiKey: localStorage.getItem(STORAGE_KEY) || DEFAULT_API_KEY,
      method: localStorage.getItem(STORAGE_METHOD) || "hybrid_search",
      topK: localStorage.getItem(STORAGE_TOPK) || "3",
      threshold: localStorage.getItem(STORAGE_THRESHOLD) || "0",
      selectedIds: (() => {
        try {
          const arr = JSON.parse(localStorage.getItem(STORAGE_SELECTED) || "[]");
          return Array.isArray(arr) ? arr : [];
        } catch (_) {
          return [];
        }
      })()
    };
  }

  function writeConfig(partial) {
    const cur = readConfig();
    const next = Object.assign({}, cur, partial || {});
    if (partial && partial.apiBase != null) {
      localStorage.setItem(STORAGE_BASE, normalizeBase(partial.apiBase));
    }
    if (partial && partial.apiKey != null) {
      localStorage.setItem(STORAGE_KEY, String(partial.apiKey).trim() || DEFAULT_API_KEY);
    }
    if (partial && partial.method != null) localStorage.setItem(STORAGE_METHOD, partial.method);
    if (partial && partial.topK != null) localStorage.setItem(STORAGE_TOPK, String(partial.topK));
    if (partial && partial.threshold != null) localStorage.setItem(STORAGE_THRESHOLD, String(partial.threshold));
    if (partial && partial.selectedIds != null) {
      localStorage.setItem(STORAGE_SELECTED, JSON.stringify(Array.from(partial.selectedIds)));
    }
    return readConfig();
  }

  async function kbFetch(path, options) {
    const cfg = readConfig();
    const base = normalizeBase(cfg.apiBase);
    if (!base) throw new Error("请先配置 API Base");
    const res = await fetch(base + path, {
      ...options,
      headers: {
        Authorization: "Bearer " + (cfg.apiKey || DEFAULT_API_KEY),
        "Content-Type": "application/json",
        ...(options && options.headers)
      }
    });
    const text = await res.text();
    let data = null;
    try {
      data = text ? JSON.parse(text) : null;
    } catch (_) {
      data = { raw: text };
    }
    if (!res.ok) {
      const msg = (data && (data.message || data.errorMsg || data.error || data.detail)) || text || res.statusText;
      throw new Error("HTTP " + res.status + " · " + msg);
    }
    return data;
  }

  async function listDatasets() {
    const data = await kbFetch("/knowledge/datasets?page=1&limit=50");
    return {
      list: Array.isArray(data && data.data) ? data.data : [],
      total: data && data.total
    };
  }

  async function retrieve(query, selectedIds) {
    const cfg = readConfig();
    const ids = selectedIds && selectedIds.length ? selectedIds : cfg.selectedIds;
    if (!ids.length) throw new Error("请至少选择一个知识库（可在 PC 端配置页勾选）");
    const method = cfg.method || "hybrid_search";
    const topK = Math.max(1, parseInt(cfg.topK, 10) || 3);
    const scoreThreshold = Number(cfg.threshold);
    const threshold = Number.isFinite(scoreThreshold) ? scoreThreshold : 0;

    if (ids.length === 1) {
      const data = await kbFetch("/knowledge/datasets/" + encodeURIComponent(ids[0]) + "/retrieval", {
        method: "POST",
        body: JSON.stringify({
          query,
          retrieval_method: method,
          top_k: topK,
          score_threshold: threshold
        })
      });
      return Array.isArray(data && data.result) ? data.result : [];
    }

    const qs = new URLSearchParams();
    ids.forEach((id) => qs.append("dataset_ids", id));
    qs.set("query", query);
    qs.set("retrieval_method", method);
    qs.set("top_k", String(topK));
    qs.set("score_threshold", String(threshold));
    const data = await kbFetch("/knowledge/datasets/retrieval?" + qs.toString(), { method: "GET" });
    return Array.isArray(data && data.result) ? data.result : [];
  }

  function buildContext(results) {
    if (!results || !results.length) return "（未检索到相关片段）";
    return results
      .slice(0, 5)
      .map((r, i) => {
        const title = r.title || (r.metadata && r.metadata.document_name) || "片段 " + (i + 1);
        const body = String(r.content || "").replace(/\s+/g, " ").trim();
        return "[" + (i + 1) + "] " + title + "\n" + (body.length > 1200 ? body.slice(0, 1200) + "…" : body);
      })
      .join("\n\n");
  }

  async function streamLLM(messages, onDelta, signal) {
    const response = await fetch(LLM_API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + LLM_API_KEY
      },
      body: JSON.stringify({ model: LLM_MODEL, messages, stream: true }),
      signal
    });
    if (!response.ok) {
      const errText = await response.text();
      throw new Error("LLM HTTP " + response.status + " · " + errText.slice(0, 240));
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let full = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || !trimmed.startsWith("data:")) continue;
        const data = trimmed.slice(5).trim();
        if (data === "[DONE]") continue;
        try {
          const parsed = JSON.parse(data);
          const delta =
            parsed.choices && parsed.choices[0] && parsed.choices[0].delta && parsed.choices[0].delta.content;
          if (delta) {
            full += delta;
            onDelta(full, delta);
          }
        } catch (_) {}
      }
    }
    return full;
  }

  function sourceTitle(s) {
    return s.title || (s.metadata && s.metadata.document_name) || "文档";
  }

  function sourceScore(s) {
    const score = s.metadata && (s.metadata.rerank_score != null ? s.metadata.rerank_score : s.metadata.score);
    return score != null ? Number(score) : null;
  }

  function renderCollapsedSources(container, sources) {
    if (!sources || !sources.length) return;
    const block = document.createElement("div");
    block.className = "src-block";
    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "src-toggle";
    toggle.setAttribute("aria-expanded", "false");
    toggle.innerHTML =
      '<span class="src-toggle-label">相关材料 · ' +
      sources.length +
      ' 份</span><span class="src-chevron">▾</span>';
    const panel = document.createElement("div");
    panel.className = "src-panel is-collapsed";
    panel.hidden = true;
    sources.forEach((s) => {
      const item = document.createElement("div");
      item.className = "src-item";
      const score = sourceScore(s);
      const name = sourceTitle(s);
      const meta = document.createElement("div");
      meta.className = "src-meta";
      const clip = document.createElement("span");
      clip.className = "src-clip";
      clip.textContent = "📎";
      const nameEl = document.createElement("span");
      nameEl.className = "src-name";
      nameEl.textContent = name + (score != null ? " · " + score.toFixed(3) : "");
      meta.appendChild(clip);
      meta.appendChild(nameEl);
      const body = document.createElement("div");
      body.className = "src-body";
      const snippet = String(s.content || "").replace(/\s+/g, " ").trim();
      body.textContent = snippet.length > 280 ? snippet.slice(0, 280) + "…" : snippet;
      item.appendChild(meta);
      item.appendChild(body);
      panel.appendChild(item);
    });
    toggle.addEventListener("click", () => {
      const open = panel.hidden;
      panel.hidden = !open;
      panel.classList.toggle("is-collapsed", !open);
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
      var chev = toggle.querySelector(".src-chevron");
      if (chev) chev.textContent = open ? "▴" : "▾";
    });
    block.appendChild(toggle);
    block.appendChild(panel);
    container.appendChild(block);
  }

  Object.assign(global.Caizhi = global.Caizhi || {}, {
    SUGGESTIONS: SUGGESTIONS,
    DEFAULT_API_BASE: DEFAULT_API_BASE,
    DEFAULT_API_KEY: DEFAULT_API_KEY,
    LLM_MODEL: LLM_MODEL,
    normalizeBase: normalizeBase,
    readConfig: readConfig,
    writeConfig: writeConfig,
    listDatasets: listDatasets,
    retrieve: retrieve,
    buildContext: buildContext,
    streamLLM: streamLLM,
    LLM_SYSTEM: LLM_SYSTEM,
    renderCollapsedSources: renderCollapsedSources,
    sourceTitle: sourceTitle
  });
  // 兼容裸标识符与显式 window 访问
  try { window.Caizhi = global.Caizhi; } catch (e) {}
})(typeof window !== 'undefined' ? window : globalThis);
  var Caizhi = window.Caizhi;

  if (!window.Caizhi || typeof window.Caizhi.retrieve !== "function") {
    console.error("Caizhi core failed to initialize");
  }

    const el = {
      chat: document.getElementById("chat"),
      form: document.getElementById("form"),
      input: document.getElementById("input"),
      send: document.getElementById("send"),
      hot: document.getElementById("hot"),
      kbPill: document.getElementById("kbPill"),
      apiBase: document.getElementById("apiBase"),
      apiKey: document.getElementById("apiKey"),
      method: document.getElementById("method"),
      topK: document.getElementById("topK"),
      threshold: document.getElementById("threshold"),
      btnConnect: document.getElementById("btnConnect"),
      btnSave: document.getElementById("btnSave"),
      connStatus: document.getElementById("connStatus"),
      datasetList: document.getElementById("datasetList"),
      listStatus: document.getElementById("listStatus")
    };

    const state = { datasets: [], selectedIds: new Set(), busy: false, abort: null };

    document.getElementById("today").textContent = new Date().toLocaleString("zh-CN", {
      year: "numeric", month: "2-digit", day: "2-digit", weekday: "long"
    });

    function setStatus(node, text, kind) {
      node.textContent = text || "";
      node.className = "status" + (kind ? " " + kind : "");
    }

    function loadForm() {
      const cfg = window.Caizhi.readConfig();
      el.apiBase.value = cfg.apiBase;
      el.apiKey.value = cfg.apiKey;
      el.method.value = cfg.method;
      el.topK.value = cfg.topK;
      el.threshold.value = cfg.threshold;
      state.selectedIds = new Set(cfg.selectedIds || []);
    }

    function persistForm(extra) {
      window.Caizhi.writeConfig(
        Object.assign(
          {
            apiBase: el.apiBase.value,
            apiKey: el.apiKey.value,
            method: el.method.value,
            topK: el.topK.value,
            threshold: el.threshold.value,
            selectedIds: Array.from(state.selectedIds)
          },
          extra || {}
        )
      );
    }

    function renderDatasets() {
      el.datasetList.innerHTML = "";
      if (!state.datasets.length) {
        el.datasetList.innerHTML = '<div class="status">暂无知识库</div>';
        return;
      }
      state.datasets.forEach((ds) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "dataset-item" + (state.selectedIds.has(ds.id) ? " active" : "");
        btn.innerHTML = "<strong></strong><span></span>";
        btn.querySelector("strong").textContent = ds.name || ds.id;
        btn.querySelector("span").textContent =
          (ds.document_count != null ? ds.document_count + " 篇" : "") +
          (ds.word_count != null ? " · " + ds.word_count + " 字" : "");
        btn.addEventListener("click", () => {
          if (state.selectedIds.has(ds.id)) state.selectedIds.delete(ds.id);
          else state.selectedIds.add(ds.id);
          persistForm();
          renderDatasets();
          updatePill();
        });
        el.datasetList.appendChild(btn);
      });
    }

    function updatePill() {
      const n = state.datasets.reduce((acc, d) => acc + (d.document_count || 0), 0);
      const sel = state.selectedIds.size;
      el.kbPill.textContent = "知识库已入库 " + n + " 篇 · 已选 " + sel;
    }

    async function connect() {
      setStatus(el.connStatus, "连接中…");
      try {
        persistForm();
        const { list, total } = await window.Caizhi.listDatasets();
        state.datasets = list;
        if (!state.selectedIds.size && list.length) {
          state.selectedIds = new Set([list[0].id]);
          persistForm();
        }
        renderDatasets();
        updatePill();
        setStatus(el.connStatus, "已连接 · 共 " + (total != null ? total : list.length) + " 个", "ok");
        setStatus(el.listStatus, "修改后自动同步到移动端", "ok");
      } catch (err) {
        setStatus(el.connStatus, String(err.message || err), "err");
        setStatus(el.listStatus, "连接失败", "err");
      }
    }

    function addMsg(role, text) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + role;
      wrap.innerHTML =
        '<div class="ava">' + (role === "user" ? "我" : "湘") + '</div><div class="stack"><div class="bubble"><div class="body"></div></div></div>';
      wrap.querySelector(".body").textContent = text || "";
      el.chat.appendChild(wrap);
      el.chat.scrollTop = el.chat.scrollHeight;
      return { wrap, body: wrap.querySelector(".body"), stack: wrap.querySelector(".stack") };
    }

    function showTyping() {
      const t = document.createElement("div");
      t.className = "typing";
      t.id = "typing";
      t.innerHTML = "<i></i><i></i><i></i>";
      el.chat.appendChild(t);
      el.chat.scrollTop = el.chat.scrollHeight;
    }
    function hideTyping() {
      const t = document.getElementById("typing");
      if (t) t.remove();
    }

    async function ask(question) {
      const q = String(question || "").trim();
      if (!q || state.busy) return;
      state.busy = true;
      el.send.disabled = true;
      addMsg("user", q);
      el.input.value = "";
      showTyping();
      state.abort = new AbortController();
      try {
        persistForm();
        const results = await window.Caizhi.retrieve(q, Array.from(state.selectedIds));
        const sources = results.slice(0, 5);
        hideTyping();
        const bot = addMsg("bot", results.length ? "正在根据知识库生成回答…" : "未检索到相关片段，尝试通则作答…");
        const answer = await window.Caizhi.streamLLM(
          [
            { role: "system", content: window.Caizhi.LLM_SYSTEM },
            {
              role: "user",
              content:
                "用户问题：\n" + q + "\n\n知识库检索片段：\n" + window.Caizhi.buildContext(results) +
                "\n\n请基于上述片段作答；若片段无关，请说明资料不足。"
            }
          ],
          (full) => {
            bot.body.textContent = full;
            el.chat.scrollTop = el.chat.scrollHeight;
          },
          state.abort.signal
        );
        if (!answer) bot.body.textContent = "模型未返回内容，请稍后重试。";
        window.Caizhi.renderCollapsedSources(bot.stack, sources);
        el.chat.scrollTop = el.chat.scrollHeight;
      } catch (err) {
        hideTyping();
        addMsg("bot", "问答失败：" + (err.message || err));
      } finally {
        state.busy = false;
        state.abort = null;
        el.send.disabled = false;
        el.input.focus();
      }
    }

    function renderHot() {
      el.hot.innerHTML = "";
      window.Caizhi.SUGGESTIONS.forEach((q) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = q;
        b.addEventListener("click", () => ask(q));
        el.hot.appendChild(b);
      });
    }

    el.btnSave.addEventListener("click", () => {
      persistForm();
      setStatus(el.connStatus, "已保存，移动端将同步", "ok");
    });
    el.btnConnect.addEventListener("click", connect);
    el.form.addEventListener("submit", (e) => {
      e.preventDefault();
      ask(el.input.value);
    });

    loadForm();
    renderHot();
    addMsg(
      "bot",
      "你好，我是湘财晓助。可咨询财务制度、报销流程与系统操作问题；支持文字提问。相关材料默认收起，点击后展开。"
    );
    connect();
  
</script>
</body>
</html>
