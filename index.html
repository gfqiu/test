<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>湘财晓助 | 财务智能办公助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #4f6ef7;
      --blue-deep: #3b57e0;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --bg: #f3f5f9;
      --card: #fff;
      --navy: #243447;
      --peach: #f8ebe4;
      --shadow: 0 10px 28px rgba(31, 41, 55, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans SC", sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
    }
    .page {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 1.35rem 1.25rem 2rem;
    }
    .hero h1 {
      font-size: clamp(1.45rem, 2.4vw, 1.85rem);
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .layout {
      margin-top: 1.15rem;
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 1rem;
      align-items: stretch;
      height: calc(100vh - 110px);
      min-height: 520px;
    }
    .chat-stage {
      height: 100%;
      max-height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border: 2px dashed #93c5fd;
      border-radius: 18px;
      background: linear-gradient(180deg, #f8fbff 0%, #f1f5f9 100%);
      padding: 0.55rem;
      box-sizing: border-box;
    }
    .chat-stage-label {
      flex-shrink: 0;
      align-self: flex-start;
      margin: 0 0 0.45rem 0.15rem;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .chat-card, .cfg-drawer {
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(229, 231, 235, 0.9);
    }
    .chat-card {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-head {
      padding: 0.9rem 1.1rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 600;
    }
    .chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
      background: #fcfcfd;
    }
    .msg { max-width: 86%; display: flex; gap: 0.55rem; animation: rise 0.3s ease both; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg .ava {
      width: 2rem; height: 2rem; border-radius: 50%;
      background: var(--blue); color: #fff; display: flex;
      align-items: center; justify-content: center; font-size: 0.75rem; flex-shrink: 0;
    }
    .msg.user .ava { background: #94a3b8; }
    .bubble {
      background: #f3f4f6;
      border-radius: 12px;
      padding: 0.8rem 0.95rem;
      line-height: 1.65;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble { background: #e8eeff; }
    .src-block { margin-top: 0.5rem; }
    .src-toggle {
      appearance: none; border: 1px solid var(--line); background: #fff;
      border-radius: 8px; padding: 0.35rem 0.65rem; cursor: pointer;
      font: inherit; font-size: 0.78rem; color: var(--muted);
      display: inline-flex; align-items: center; gap: 0.35rem;
    }
    .src-panel { margin-top: 0.45rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .src-panel[hidden], .src-panel.is-collapsed { display: none !important; }
    .src-item {
      background: #fff; border: 1px solid var(--line); border-radius: 10px;
      padding: 0.55rem 0.7rem;
    }
    .src-meta { font-size: 0.8rem; color: var(--blue-deep); font-weight: 500; margin-bottom: 0.25rem; }
    .src-body { font-size: 0.78rem; color: var(--muted); line-height: 1.45; white-space: pre-wrap; }
    .composer-box {
      flex-shrink: 0;
      border-top: 1px solid var(--line);
      background: #fff;
    }
    .quick-q {
      display: flex; flex-wrap: wrap; gap: 0.4rem;
      padding: 0;
    }
    .quick-q button {
      appearance: none; border: 1px solid #c7d2fe; background: #f8fafc;
      border-radius: 999px; padding: 0.35rem 0.7rem; cursor: pointer;
      font: inherit; font-size: 0.75rem; color: var(--ink); text-align: left;
      max-width: 100%;
    }
    .quick-q button:hover { background: #eef2ff; border-color: #a5b4fc; }
    .img-previews {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      padding: 0.75rem 1rem 0;
    }
    .img-previews[hidden] { display: none !important; }
    .img-thumb {
      position: relative; width: 72px; height: 72px; border-radius: 10px;
      overflow: hidden; border: 1px solid var(--line); background: #f8fafc;
    }
    .img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .img-thumb button {
      position: absolute; top: 2px; right: 2px; width: 20px; height: 20px;
      border: 0; border-radius: 50%; background: rgba(15,23,42,0.65); color: #fff;
      font-size: 12px; line-height: 1; cursor: pointer; padding: 0;
    }
    .composer {
      padding: 0.85rem 1rem;
      display: flex; gap: 0.55rem; align-items: center;
    }
    .composer input[type="text"] {
      flex: 1; border: 1px solid var(--line); border-radius: 999px;
      padding: 0.75rem 1rem; font: inherit; outline: none;
    }
    .composer input[type="text"]:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(79,110,247,0.12); }
    .composer button {
      appearance: none; border: 0; background: var(--blue); color: #fff;
      border-radius: 10px; padding: 0.7rem 1.1rem; font: inherit; font-weight: 500;
      cursor: pointer;
    }
    .composer .common-menu {
      position: relative; flex-shrink: 0;
    }
    .composer button.common-btn,
    .composer button.upload-btn {
      background: #eef2ff; color: var(--blue-deep); border: 1px solid #c7d2fe;
      padding: 0.7rem 0.9rem; white-space: nowrap;
    }
    .composer .common-panel {
      position: absolute; left: 0; bottom: calc(100% + 6px);
      min-width: 128px; padding: 0.35rem;
      background: #fff; border: 1px solid var(--line); border-radius: 10px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
      display: none; z-index: 5;
    }
    .composer .common-menu.open .common-panel { display: block; }
    .composer .common-panel button {
      width: 100%; background: #fff; color: var(--ink); border: 0;
      border-radius: 8px; padding: 0.55rem 0.7rem; text-align: left;
      font-weight: 500;
    }
    .composer .common-panel button:hover { background: #eef2ff; color: var(--blue-deep); }
    .composer button:disabled { opacity: 0.55; cursor: not-allowed; }
    .user-imgs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.45rem; }
    .user-imgs img {
      width: 88px; height: 88px; object-fit: cover; border-radius: 8px;
      border: 1px solid rgba(79,110,247,0.2);
    }
    .ticket-board { margin-top: 0.55rem; display: flex; flex-direction: column; gap: 0.7rem; }
    .ticket-card {
      background: #fff; border: 1px solid var(--line); border-radius: 12px;
      padding: 0.75rem 0.85rem;
    }
    .ticket-card h4 {
      font-size: 0.85rem; font-weight: 600; margin-bottom: 0.55rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .ticket-card h4 img {
      width: 40px; height: 40px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line);
    }
    .ticket-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem 0.65rem;
    }
    .ticket-grid label {
      display: flex; flex-direction: column; gap: 0.2rem;
      font-size: 0.72rem; color: var(--muted);
    }
    .ticket-grid label.full { grid-column: 1 / -1; }
    .ticket-grid input, .ticket-grid select {
      border: 1px solid var(--line); border-radius: 8px;
      padding: 0.4rem 0.5rem; font: inherit; font-size: 0.82rem; color: var(--ink);
      background: #f8fafc;
    }
    .ticket-actions { margin-top: 0.55rem; display: flex; gap: 0.4rem; }
    .ticket-actions button {
      appearance: none; border: 1px solid var(--line); background: #fff;
      border-radius: 8px; padding: 0.35rem 0.7rem; font: inherit; font-size: 0.75rem;
      cursor: pointer;
    }
    .ticket-actions button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .side { display: flex; flex-direction: column; gap: 0.85rem; min-height: 0; max-height: 100%; overflow-y: auto; }
    .cfg-drawer {
      padding: 0.75rem 0.85rem;
      opacity: 0.88;
    }
    .cfg-drawer summary {
      cursor: pointer; font-size: 0.78rem; color: var(--muted);
      list-style: none; display: flex; align-items: center; justify-content: space-between;
    }
    .cfg-drawer summary::-webkit-details-marker { display: none; }
    .cfg-body { margin-top: 0.65rem; display: flex; flex-direction: column; gap: 0.45rem; }
    .field label { display: block; font-size: 0.72rem; color: var(--muted); margin-bottom: 0.2rem; }
    .field input, .field select {
      width: 100%; border: 1px solid var(--line); border-radius: 8px;
      padding: 0.4rem 0.5rem; font: inherit; font-size: 0.8rem;
    }
    .cfg-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .cfg-actions button {
      appearance: none; border: 1px solid var(--line); background: #fff;
      border-radius: 8px; padding: 0.35rem 0.55rem; font: inherit; font-size: 0.75rem;
      cursor: pointer;
    }
    .cfg-actions button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .dataset-list { max-height: 160px; overflow: auto; display: flex; flex-direction: column; gap: 0.3rem; }
    .dataset-item {
      text-align: left; border: 1px solid var(--line); background: #fafafa;
      border-radius: 8px; padding: 0.4rem 0.5rem; cursor: pointer; font-size: 0.75rem;
    }
    .dataset-item.active { border-color: var(--blue); background: #eef2ff; }
    .dataset-item strong { display: block; font-size: 0.78rem; }
    .status { font-size: 0.72rem; color: var(--muted); min-height: 1em; }
    .status.ok { color: #059669; }
    .status.err { color: #dc2626; }
    .typing { display: flex; gap: 0.25rem; padding: 0.65rem 0.8rem; background: #f3f4f6; border-radius: 12px; align-self: flex-start; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); animation: blink 1.1s infinite; display: block; }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    .mobile-link {
      display: inline-block; margin-top: 0.55rem; font-size: 0.8rem; color: var(--blue-deep); text-decoration: none;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; transform: translateY(-2px); }
    }

    .chat-body {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: stretch;
      background: #fcfcfd;
    }
    .history-rail {
      flex-shrink: 0;
      display: flex;
      align-items: stretch;
      border-right: 1px solid var(--line);
      background: #fff;
    }
    .history-toggle {
      appearance: none; border: 0; background: #f8fafc; color: var(--muted);
      width: 34px; cursor: pointer; font: inherit; font-size: 0.72rem;
      writing-mode: vertical-rl; letter-spacing: 0.12em; padding: 0.6rem 0;
    }
    .history-toggle:hover { background: #eef2ff; color: var(--blue-deep); }
    .history-rail.open .history-toggle { background: #eef2ff; color: var(--blue-deep); }
    .history-panel {
      width: 0; overflow: hidden; transition: width 0.2s ease;
      display: flex; flex-direction: column; background: #fff;
    }
    .history-rail.open .history-panel { width: 210px; border-left: 1px solid var(--line); }
    .history-rail:not(.open) .history-panel { width: 0; padding: 0; border: 0; }
    .history-head {
      flex-shrink: 0; padding: 0.65rem 0.75rem; font-size: 0.78rem; font-weight: 600;
      border-bottom: 1px solid var(--line); color: var(--ink); white-space: nowrap;
    }
    .history-list {
      flex: 1; min-height: 0; overflow-y: auto; padding: 0.45rem;
      display: flex; flex-direction: column; gap: 0.35rem;
    }
    .history-item {
      appearance: none; border: 1px solid var(--line); background: #f8fafc;
      border-radius: 8px; padding: 0.45rem 0.55rem; text-align: left; cursor: pointer;
      font: inherit; font-size: 0.72rem; color: var(--ink); width: 100%;
    }
    .history-item:hover { background: #eef2ff; border-color: #c7d2fe; }
    .history-item .meta { display: block; color: var(--muted); font-size: 0.66rem; margin-top: 0.15rem; }
    .history-empty { font-size: 0.72rem; color: var(--muted); padding: 0.5rem; white-space: nowrap; }
    .chat-body .chat { flex: 1; border: 0; }
    .quick-bar {
      display: flex; align-items: flex-start; gap: 0.45rem;
      padding: 0.75rem 1rem 0;
    }
    .new-chat-btn {
      appearance: none; flex-shrink: 0; border: 1px solid #c7d2fe; background: #eef2ff;
      color: var(--blue-deep); border-radius: 999px; padding: 0.35rem 0.75rem;
      font: inherit; font-size: 0.75rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .new-chat-btn:hover { background: #e0e7ff; }
    .quick-bar .quick-q { padding: 0; flex: 1; }

    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; height: auto; min-height: 0; }
      .chat-stage { height: min(70vh, 720px); max-height: min(70vh, 720px); }
      .chat-card { height: auto; max-height: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <h1>湘财晓助 | 财务智能办公助手</h1>
      <a class="mobile-link" href="mobile.html?v=self-20260909">打开移动端页面 →</a>
    </div>

    <div class="layout">
      <div class="chat-stage">
        <div class="chat-stage-label">展示区域</div>
        <section class="chat-card">
          <div class="chat-head">
            <span>🤖 湘财晓助</span>
          </div>
          <div class="chat-body">
            <aside class="history-rail" id="historyRail">
              <button type="button" class="history-toggle" id="btnHistory" title="历史对话" aria-expanded="false">历史对话</button>
              <div class="history-panel" id="historyPanel">
                <div class="history-head">历史对话</div>
                <div class="history-list" id="historyList"></div>
              </div>
            </aside>
            <div class="chat" id="chat" role="log" aria-live="polite"></div>
          </div>
          <div class="composer-box">
            <div class="quick-bar">
              <button type="button" class="new-chat-btn" id="btnNewChat" title="开始新对话">+ 新对话</button>
              <div class="quick-q" id="quickQ"></div>
            </div>

            <form class="composer" id="form" autocomplete="off">
              <div class="common-menu" id="commonMenu">
                <button type="button" class="common-btn" id="btnCommon" title="常用功能">常用</button>
                <div class="common-panel" id="commonPanel">
                  <button type="button" class="upload-btn" id="btnUpload" title="上传发票图片">上传发票</button>
                </div>
              </div>
              <input id="fileImages" type="file" accept="image/*" multiple hidden />
              <input id="input" type="text" maxlength="800" placeholder="请输入问题，或通过「常用」上传发票识别…" aria-label="问题输入" />

          </div>

      </div>

      <aside class="side">
        <details class="cfg-drawer" id="cfgDrawer">
          <summary>高级 · 服务对接 / 知识库 <span>⚙</span></summary>
          <div class="cfg-body">
            <div class="field">
              <label>API Base（含 /v1）</label>
              <input id="apiBase" type="text" />
            </div>
            <div class="field">
              <label>API-Key</label>
              <input id="apiKey" type="password" />
            </div>
            <div class="field">
              <label>检索方式</label>
              <select id="method">
                <option value="hybrid_search">混合检索</option>
                <option value="semantic_search">语义检索</option>
                <option value="full_text_search">全文检索</option>
              </select>
            </div>
            <div class="field">
              <label>Top K</label>
              <input id="topK" type="text" />
            </div>
            <div class="field">
              <label>Score 阈值</label>
              <input id="threshold" type="text" />
            </div>
            <div class="cfg-actions">
              <button type="button" class="primary" id="btnConnect">连接</button>
              <button type="button" id="btnSave">保存</button>
            </div>
            <p class="status" id="connStatus"></p>
            <div class="section-label" style="font-size:0.72rem;color:var(--muted);">知识库（点击多选）</div>
            <div class="dataset-list" id="datasetList"></div>
            <p class="status" id="listStatus"></p>
          </div>
        </details>
      </aside>
    </div>
  </div>

  
  
<script>
/* 湘财 · 共享逻辑：知识库检索 + DeepSeek 流式问答；配置经 localStorage 双端同步 */
(function (global) {
  const DEFAULT_API_BASE = "https://agent.unidt.com/v1";
  const DEFAULT_API_KEY = "dataset-adoZr8SvffoDDlAGZibbdAip";
  const STORAGE_BASE = "caizhi_api_base";
  const STORAGE_KEY = "caizhi_api_key";
  const STORAGE_SELECTED = "caizhi_selected_ids";
  const STORAGE_METHOD = "caizhi_method";
  const STORAGE_TOPK = "caizhi_topk";
  const STORAGE_THRESHOLD = "caizhi_threshold";

  const LLM_API_URL = "https://ai-api.unidtai.com/openapi/llm/compatible-mode/v1/chat/completions";
  const LLM_API_KEY = "sk-60569506137942a6a2b18b7aedbef8d1";
  const LLM_MODEL = "deepseek/deepseek-v4-flash-vision-exp";
  const LLM_SYSTEM =
    "你是企业内部财务智能知识助手「湘财晓助」。请严格依据用户提供的知识库检索片段组织答案；若片段不足以回答，请明确说明资料不足，不要编造制度条文。回答使用自然、口语化的中文，可分点叙述，但禁止输出 Markdown 标记（如 **、#、`、- []、> 等）。不要在回答中写“依据：……”或引用“制度第×条”“附录×”“速查表”等出处标注。直接给出可执行的说明即可。不要透露底层模型名称。";

  const SUGGESTIONS = [
    "员工差旅费报销标准",
    "普通业务往来招待标准",
    "固定资产的折旧年限",
    "费用报销有时限要求吗"
  ];

  function normalizeBase(raw) {
    let base = String(raw || "").trim().replace(/\/+$/, "");
    if (/^http:\/\/agent\.unidt\.com\b/i.test(base)) base = base.replace(/^http:/i, "https:");
    return base;
  }

  function readConfig() {
    const params = new URLSearchParams(location.search);
    const fromQuery = params.get("base") || params.get("api");
    return {
      apiBase: normalizeBase(fromQuery || localStorage.getItem(STORAGE_BASE) || DEFAULT_API_BASE),
      apiKey: localStorage.getItem(STORAGE_KEY) || DEFAULT_API_KEY,
      method: localStorage.getItem(STORAGE_METHOD) || "hybrid_search",
      topK: localStorage.getItem(STORAGE_TOPK) || "3",
      threshold: localStorage.getItem(STORAGE_THRESHOLD) || "0",
      selectedIds: (() => {
        try {
          const arr = JSON.parse(localStorage.getItem(STORAGE_SELECTED) || "[]");
          return Array.isArray(arr) ? arr : [];
        } catch (_) {
          return [];
        }
      })()
    };
  }

  function writeConfig(partial) {
    const cur = readConfig();
    const next = Object.assign({}, cur, partial || {});
    if (partial && partial.apiBase != null) {
      localStorage.setItem(STORAGE_BASE, normalizeBase(partial.apiBase));
    }
    if (partial && partial.apiKey != null) {
      localStorage.setItem(STORAGE_KEY, String(partial.apiKey).trim() || DEFAULT_API_KEY);
    }
    if (partial && partial.method != null) localStorage.setItem(STORAGE_METHOD, partial.method);
    if (partial && partial.topK != null) localStorage.setItem(STORAGE_TOPK, String(partial.topK));
    if (partial && partial.threshold != null) localStorage.setItem(STORAGE_THRESHOLD, String(partial.threshold));
    if (partial && partial.selectedIds != null) {
      localStorage.setItem(STORAGE_SELECTED, JSON.stringify(Array.from(partial.selectedIds)));
    }
    return readConfig();
  }

  async function kbFetch(path, options) {
    const cfg = readConfig();
    const base = normalizeBase(cfg.apiBase);
    if (!base) throw new Error("请先配置 API Base");
    const res = await fetch(base + path, {
      ...options,
      headers: {
        Authorization: "Bearer " + (cfg.apiKey || DEFAULT_API_KEY),
        "Content-Type": "application/json",
        ...(options && options.headers)
      }
    });

  async function retrieve(query, selectedIds) {
    const cfg = readConfig();
    const ids = selectedIds && selectedIds.length ? selectedIds : cfg.selectedIds;
    if (!ids.length) throw new Error("请至少选择一个知识库（可在 PC 端配置页勾选）");
    const method = cfg.method || "hybrid_search";
    const topK = Math.max(1, parseInt(cfg.topK, 10) || 3);
    const scoreThreshold = Number(cfg.threshold);
    const threshold = Number.isFinite(scoreThreshold) ? scoreThreshold : 0;

    if (ids.length === 1) {
      const data = await kbFetch("/knowledge/datasets/" + encodeURIComponent(ids[0]) + "/retrieval", {
        method: "POST",
        body: JSON.stringify({
          query,
          retrieval_method: method,
          top_k: topK,
          score_threshold: threshold
        })
      });
      return Array.isArray(data && data.result) ? data.result : [];
    }

    const qs = new URLSearchParams();
    ids.forEach((id) => qs.append("dataset_ids", id));
    qs.set("query", query);
    qs.set("retrieval_method", method);
    qs.set("top_k", String(topK));
    qs.set("score_threshold", String(threshold));
    const data = await kbFetch("/knowledge/datasets/retrieval?" + qs.toString(), { method: "GET" });
    return Array.isArray(data && data.result) ? data.result : [];
  }

      .join("\n\n");

  async function streamLLM(messages, onDelta, signal) {
    const response = await fetch(LLM_API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + LLM_API_KEY
      },
      body: JSON.stringify({ model: LLM_MODEL, messages, stream: true }),
      signal
    });
    if (!response.ok) {
      const errText = await response.text();
      throw new Error("LLM HTTP " + response.status + " · " + errText.slice(0, 240));
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let full = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || !trimmed.startsWith("data:")) continue;
        const data = trimmed.slice(5).trim();
        if (data === "[DONE]") continue;
        try {
          const parsed = JSON.parse(data);
          const delta =
            parsed.choices && parsed.choices[0] && parsed.choices[0].delta && parsed.choices[0].delta.content;
          if (delta) {
            full += delta;
            onDelta(full, delta);
          }
        } catch (_) {}
      }
    }
    return full;
  }

  async function completeLLM(messages, signal) {
    const response = await fetch(LLM_API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + LLM_API_KEY
      },
      body: JSON.stringify({ model: LLM_MODEL, messages, stream: false }),
      signal
    });
    const text = await response.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = { raw: text }; }
    if (!response.ok) {
      const msg = (data && (data.message || data.error || data.detail)) || text || response.statusText;
      throw new Error("LLM HTTP " + response.status + " · " + String(msg).slice(0, 240));
    }
    return (data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "";
  }

  function parseJsonLoose(raw) {
    const text = String(raw || "").trim();
    if (!text) return null;
    try { return JSON.parse(text); } catch (_) {}
    const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fenced) {
      try { return JSON.parse(fenced[1].trim()); } catch (_) {}
    }
    const start = text.indexOf("{");
    const end = text.lastIndexOf("}");
    if (start >= 0 && end > start) {
      try { return JSON.parse(text.slice(start, end + 1)); } catch (_) {}
    }
    return null;
  }

  async function extractTicketFromImage(dataUrl, signal) {
    const prompt =
      "你是财务票据 OCR 助手。请识别图片中的文字，并提取差旅/交通票据关键字段。" +
      "只返回一个 JSON 对象，不要 Markdown，不要解释。字段如下：" +
      '{"departureCity":"出发城市","departureTime":"出发时间","arrivalCity":"到达城市","arrivalTime":"到达时间","amount":"金额数字字符串","rawText":"图片可见文字摘要"}。' +
      "无法识别的字段填空字符串。金额只保留数字和小数点。";
    const content = await completeLLM(
      [
        {
          role: "user",
          content: [
            { type: "text", text: prompt },
            { type: "image_url", image_url: { url: dataUrl } }
          ]
        }
      ],
      signal
    );
    const parsed = parseJsonLoose(content) || {};
    return {
      departureCity: String(parsed.departureCity || "").trim(),
      departureTime: String(parsed.departureTime || "").trim(),
      arrivalCity: String(parsed.arrivalCity || "").trim(),
      arrivalTime: String(parsed.arrivalTime || "").trim(),
      amount: String(parsed.amount || "").trim(),
      rawText: String(parsed.rawText || "").trim()
    };
  }

  function polishAnswer(text) {
    var s = String(text || "");
    s = s.replace(/\*\*/g, "");
    s = s.replace(/__/g, "");
    s = s.replace(/`+/g, "");
    s = s.replace(/^#{1,6}\s+/gm, "");
    s = s.replace(/^\s*>\s?/gm, "");
    s = s.replace(/^\s*[-*+]\s+/gm, "• ");
    s = s.replace(/（[^）]*依据[^）]*）/g, "");
    s = s.replace(/\([^)]*依据[^)]*\)/g, "");
    s = s.replace(/依据[：:][^\n。；;]*[。；;]?/g, "");
    s = s.replace(/（[^）]*(?:第\s*\d+\s*条|附录\s*[A-Za-z0-9]+)[^）]*）/g, "");
    s = s.replace(/\([^)]*(?:第\s*\d+\s*条|附录\s*[A-Za-z0-9]+)[^)]*\)/g, "");
    s = s.replace(/（\s*见?(?:制度|办法|规定|附录|附件)[^）]*）/g, "");
    s = s.replace(/(^|[\s，、；;])\*([^*\n]+)\*(?=[\s，、。；;]|$)/g, "$1$2");
    s = s.replace(/[ \t]+\n/g, "\n");
    s = s.replace(/\n{3,}/g, "\n\n");
    s = s.replace(/[ \t]{2,}/g, " ");
    return s.trim();
  }

        const results = await window.Caizhi.retrieve(q, Array.from(state.selectedIds));
        const sources = results.slice(0, 5);
        hideTyping();
        const bot = addMsg("bot", results.length ? "正在根据知识库生成回答…" : "未检索到相关片段，尝试通则作答…");
        const answer = await window.Caizhi.streamLLM(
          [
            { role: "system", content: window.Caizhi.LLM_SYSTEM },
            {
              role: "user",
              content:
                "用户问题：\n" + q + "\n\n知识库检索片段：\n" + window.Caizhi.buildContext(results) +
                "\n\n请基于上述片段作答；若片段无关，请说明资料不足。用自然中文分点说明，不要使用 Markdown（如 **），不要写“依据：制度第×条/附录”等出处。"
            }
          ],
          (full) => {
            bot.body.textContent = window.Caizhi.polishAnswer(full);
            el.chat.scrollTop = el.chat.scrollHeight;
          },
          state.abort.signal
        );
        if (!answer) bot.body.textContent = "模型未返回内容，请稍后重试。";
        else bot.body.textContent = window.Caizhi.polishAnswer(answer);
        window.Caizhi.renderCollapsedSources(bot.stack, sources);
        el.chat.scrollTop = el.chat.scrollHeight;
      } catch (err) {
        hideTyping();
        addMsg("bot", "问答失败：" + (err.message || err));
      } finally {
        state.busy = false;
        state.abort = null;
        el.send.disabled = false;
        el.input.focus();
      }
    }


    function loadHistory() {
      try {
        const arr = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        return [];
      }
    }

    function saveHistory(list) {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 30)));
    }

    function snapshotMessages() {
      const nodes = el.chat.querySelectorAll(".msg");
      const msgs = [];
      nodes.forEach(function (node) {
        const role = node.classList.contains("user") ? "user" : "bot";
        const body = node.querySelector(".body");
        const text = body ? body.textContent : "";
        if (!text) return;
        msgs.push({ role: role, text: text });
      });
      return msgs;
    }

    function hasUserMessage(msgs) {
      return (msgs || []).some(function (m) { return m.role === "user"; });
    }

    function renderHistoryList() {
      const list = loadHistory();
      el.historyList.innerHTML = "";
      if (!list.length) {
        el.historyList.innerHTML = '<div class="history-empty">暂无历史对话</div>';
        return;
      }
      list.forEach(function (item) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "history-item";
        const title = document.createElement("span");
        title.textContent = item.title || "未命名对话";
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = item.time || "";
        btn.appendChild(title);
        btn.appendChild(meta);
        btn.addEventListener("click", function () {
          restoreConversation(item);
        });
        el.historyList.appendChild(btn);
      });
    }

    function archiveCurrentConversation() {
      const msgs = snapshotMessages();
      if (!hasUserMessage(msgs)) return;
      const firstUser = msgs.find(function (m) { return m.role === "user"; });
      const title = String(firstUser && firstUser.text || "对话").replace(/\s+/g, " ").trim().slice(0, 24);
      const now = new Date();
      const time = now.toLocaleString("zh-CN", {
        month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
      });
      const list = loadHistory();
      list.unshift({
        id: String(Date.now()),
        title: title || "对话",
        time: time,
        messages: msgs
      });
      saveHistory(list);
      renderHistoryList();
    }

    function startNewConversation() {
      if (state.busy) return;
      archiveCurrentConversation();
      el.chat.innerHTML = "";
      state.pendingImages = [];
      renderPendingPreviews();
      addMsg("bot", WELCOME_TEXT);
      el.input.focus();
    }

    function restoreConversation(item) {
      if (state.busy) return;
      archiveCurrentConversation();
      el.chat.innerHTML = "";
      state.pendingImages = [];
      renderPendingPreviews();
      (item.messages || []).forEach(function (m) {
        addMsg(m.role === "user" ? "user" : "bot", m.text || "");
      });
      el.chat.scrollTop = el.chat.scrollHeight;
    }

    function toggleHistory() {
      state.historyOpen = !state.historyOpen;
      el.historyRail.classList.toggle("open", state.historyOpen);
      el.btnHistory.setAttribute("aria-expanded", state.historyOpen ? "true" : "false");
      if (state.historyOpen) renderHistoryList();
    }

    function renderQuickQ() {
      el.quickQ.innerHTML = "";
      window.Caizhi.SUGGESTIONS.forEach((q) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = q;
        b.title = q;
        b.addEventListener("click", () => ask(q));
        el.quickQ.appendChild(b);
      });
    }

    el.btnSave.addEventListener("click", () => {
      persistForm();
      setStatus(el.connStatus, "已保存，移动端将同步", "ok");
    });
    el.btnConnect.addEventListener("click", connect);
    el.btnCommon.addEventListener("click", function (e) {
      e.stopPropagation();
      el.commonMenu.classList.toggle("open");
    });
    el.btnUpload.addEventListener("click", function () {
      el.commonMenu.classList.remove("open");
      el.fileImages.click();
    });
    document.addEventListener("click", function (e) {
      if (!el.commonMenu.contains(e.target)) el.commonMenu.classList.remove("open");
    });
    el.fileImages.addEventListener("change", function () {
      onFilesSelected(el.fileImages.files).catch(function (err) {
        addMsg("bot", "上传失败：" + (err.message || err));
      });
    });
    el.form.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = el.input.value;
      el.input.value = "";
      ask(q);
    });


    el.btnNewChat.addEventListener("click", startNewConversation);
    el.btnHistory.addEventListener("click", function (e) {
      e.stopPropagation();
      toggleHistory();
    });

    loadForm();
    renderQuickQ();
    renderHistoryList();
    addMsg("bot", WELCOME_TEXT);
    connect();
  
</script>
</body>
</html>
