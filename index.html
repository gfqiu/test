<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>财知 · 企业财务智能知识助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0f1c24;
      --ink-soft: #3a5160;
      --muted: #6a8190;
      --line: rgba(15, 28, 36, 0.12);
      --panel: rgba(248, 252, 251, 0.82);
      --teal: #0d6e6e;
      --teal-deep: #084848;
      --teal-soft: #d7ecea;
      --sand: #f3efe6;
      --gold: #b08a3c;
      --danger: #a33b3b;
      --shadow: 0 20px 48px rgba(8, 40, 48, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: "Noto Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 50% at 0% 0%, #cfe8e4 0%, transparent 55%),
        radial-gradient(ellipse 60% 45% at 100% 100%, #e8dfc8 0%, transparent 50%),
        linear-gradient(160deg, #f7faf9 0%, #e7f0ee 48%, #dce8e4 100%);
      min-height: 100%;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(13, 110, 110, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(13, 110, 110, 0.035) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1120px, 100%);
      margin: 0 auto;
      min-height: 100%;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1rem;
      padding: 1.1rem;
    }

    aside, .main {
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      min-height: 0;
      animation: rise 0.65s ease both;
    }

    .main { animation-delay: 0.08s; display: flex; flex-direction: column; }

    aside {
      display: flex;
      flex-direction: column;
      padding: 1.1rem;
      gap: 0.9rem;
    }

    .brand {
      font-family: "Cormorant Garamond", "Noto Serif SC", serif;
      font-size: 2.35rem;
      line-height: 1;
      letter-spacing: 0.04em;
      color: var(--teal-deep);
    }

    .brand span {
      display: block;
      margin-top: 0.35rem;
      font-family: "Noto Sans SC", sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--ink-soft);
    }

    .section-label {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 0.55rem;
    }

    .field label {
      font-size: 0.78rem;
      color: var(--ink-soft);
    }

    input[type="text"], input[type="password"], select {
      width: 100%;
      border: 1px solid rgba(13, 110, 110, 0.28);
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 0.88rem;
      padding: 0.55rem 0.65rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(13, 110, 110, 0.12);
    }

    .btn {
      appearance: none;
      border: none;
      font: inherit;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, opacity 0.2s;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: var(--teal-deep);
      color: #f4fbfa;
      padding: 0.55rem 0.85rem;
      font-weight: 500;
      font-size: 0.88rem;
    }
    .btn-primary:hover { background: var(--teal); }

    .btn-ghost {
      background: transparent;
      border: 1px solid rgba(13, 110, 110, 0.3);
      color: var(--teal-deep);
      padding: 0.45rem 0.7rem;
      font-size: 0.82rem;
    }
    .btn-ghost:hover { background: var(--teal-soft); }

    .dataset-list {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      min-height: 140px;
      max-height: 42vh;
      padding-right: 0.15rem;
    }

    .dataset-item {
      text-align: left;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.7);
      padding: 0.65rem 0.7rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.2s;
    }

    .dataset-item:hover { border-color: rgba(13, 110, 110, 0.45); transform: translateY(-1px); }
    .dataset-item.active {
      background: var(--teal-soft);
      border-color: var(--teal);
    }

    .dataset-item strong {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .dataset-item small {
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.4;
    }

    .status {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.45;
      min-height: 1.2em;
    }
    .status.ok { color: var(--teal); }
    .status.err { color: var(--danger); }

    .main-header {
      padding: 1rem 1.15rem 0.85rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .main-header h1 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--ink);
    }

    .main-header p {
      margin-top: 0.3rem;
      font-size: 0.86rem;
      color: var(--ink-soft);
      max-width: 36em;
      line-height: 1.5;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      padding: 0.75rem 1.15rem 0.2rem;
    }

    .chip {
      appearance: none;
      border: 1px solid rgba(13, 110, 110, 0.28);
      background: transparent;
      color: var(--teal-deep);
      font: inherit;
      font-size: 0.78rem;
      padding: 0.32rem 0.65rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }
    .chip:hover {
      background: var(--teal);
      color: #fff;
      transform: translateY(-1px);
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      scroll-behavior: smooth;
      min-height: 280px;
    }

    .msg {
      max-width: 86%;
      padding: 0.8rem 0.95rem;
      line-height: 1.65;
      font-size: 0.93rem;
      animation: pop 0.32s ease both;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg .who {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      opacity: 0.62;
      margin-bottom: 0.28rem;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--teal-deep);
      color: #f4fbfa;
    }

    .msg.bot {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--line);
    }

    .sources {
      margin-top: 0.7rem;
      padding-top: 0.65rem;
      border-top: 1px dashed var(--line);
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .source {
      background: var(--sand);
      border-left: 3px solid var(--gold);
      padding: 0.45rem 0.6rem;
      font-size: 0.8rem;
      line-height: 1.5;
      color: var(--ink-soft);
      white-space: pre-wrap;
    }

    .source .meta {
      color: var(--muted);
      font-size: 0.72rem;
      margin-bottom: 0.2rem;
    }

    .typing {
      align-self: flex-start;
      display: flex;
      gap: 0.28rem;
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--line);
    }

    .typing i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--teal);
      display: block;
      animation: blink 1.1s infinite ease-in-out;
    }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }

    form.composer {
      display: flex;
      gap: 0.55rem;
      padding: 0.85rem 1.15rem 1.05rem;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.4);
    }

    form.composer input {
      flex: 1;
      border: 1px solid rgba(13, 110, 110, 0.32);
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 0.95rem;
      padding: 0.75rem 0.9rem;
      outline: none;
    }

    form.composer input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(13, 110, 110, 0.12);
    }

    form.composer .btn-primary {
      padding: 0 1.2rem;
      white-space: nowrap;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }

    @media (max-width: 860px) {
      .shell {
        grid-template-columns: 1fr;
        padding: 0.7rem;
      }
      aside { max-height: none; }
      .dataset-list { max-height: 180px; }
      .msg { max-width: 94%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div>
        <div class="brand">财知<span>企业内部财务智能知识助手</span></div>
      </div>

      <div>
        <div class="section-label">服务对接</div>
        <div class="field">
          <label for="apiBase">API Base（含 /v1）</label>
          <input id="apiBase" type="text" placeholder="例如 https://host/v1" autocomplete="off" />
        </div>
        <div class="field">
          <label for="apiKey">API-Key</label>
          <input id="apiKey" type="password" autocomplete="off" />
        </div>
        <div style="display:flex; gap:0.45rem; flex-wrap:wrap;">
          <button type="button" class="btn btn-primary" id="btnConnect">连接知识库</button>
          <button type="button" class="btn btn-ghost" id="btnSave">保存配置</button>
        </div>
        <p class="status" id="connStatus" style="margin-top:0.55rem;"></p>
      </div>

      <div style="flex:1; min-height:0; display:flex; flex-direction:column;">
        <div class="section-label">知识库</div>
        <div class="dataset-list" id="datasetList" aria-label="知识库列表"></div>
        <p class="status" id="listStatus" style="margin-top:0.45rem;"></p>
      </div>

      <div>
        <div class="section-label">检索参数</div>
        <div class="field">
          <label for="method">检索方式</label>
          <select id="method">
            <option value="hybrid_search" selected>混合检索</option>
            <option value="semantic_search">语义检索</option>
            <option value="full_text_search">全文检索</option>
          </select>
        </div>
        <div class="field">
          <label for="topK">Top K</label>
          <input id="topK" type="text" value="3" />
        </div>
        <div class="field">
          <label for="threshold">Score 阈值</label>
          <input id="threshold" type="text" value="0.3" />
        </div>
      </div>
    </aside>

    <section class="main">
      <div class="main-header">
        <div>
          <h1 id="activeTitle">财务知识问答</h1>
          <p>基于企业知识库实时检索报销、核算、预算、税务等制度与 FAQ，回答附带来源片段。</p>
        </div>
      </div>

      <div class="chips" id="chips" aria-label="推荐问题"></div>
      <div class="chat" id="chat" role="log" aria-live="polite"></div>

      <form class="composer" id="form" autocomplete="off">
        <input id="input" type="text" maxlength="800" placeholder="输入财务问题，例如：差旅费报销需要哪些票据？" aria-label="问题输入" />
        <button class="btn btn-primary" type="submit" id="send">提问</button>
      </form>
    </section>
  </div>

  <script>
    const DEFAULT_API_BASE = "https://agent.unidt.com/v1";
    const DEFAULT_API_KEY = "dataset-adoZr8SvffoDDlAGZibbdAip";
    const STORAGE_BASE = "caizhi_api_base";
    const STORAGE_KEY = "caizhi_api_key";

    const SUGGESTIONS = [
      "差旅费报销需要哪些票据？",
      "费用报销审批流程是怎样的？",
      "固定资产如何入账与折旧？",
      "预算追加需要什么材料？",
      "增值税专用发票如何认证？"
    ];

    const state = {
      datasets: [],
      selectedIds: new Set(),
      busy: false
    };

    const el = {
      apiBase: document.getElementById("apiBase"),
      apiKey: document.getElementById("apiKey"),
      btnConnect: document.getElementById("btnConnect"),
      btnSave: document.getElementById("btnSave"),
      connStatus: document.getElementById("connStatus"),
      datasetList: document.getElementById("datasetList"),
      listStatus: document.getElementById("listStatus"),
      method: document.getElementById("method"),
      topK: document.getElementById("topK"),
      threshold: document.getElementById("threshold"),
      activeTitle: document.getElementById("activeTitle"),
      chips: document.getElementById("chips"),
      chat: document.getElementById("chat"),
      form: document.getElementById("form"),
      input: document.getElementById("input"),
      send: document.getElementById("send")
    };

    function normalizeBase(raw) {
      let base = String(raw || "").trim().replace(/\/+$/, "");
      // HTTP→HTTPS 跳转会丢掉 Authorization，对 unidt 网关统一升为 https
      if (/^http:\/\/agent\.unidt\.com\b/i.test(base)) {
        base = base.replace(/^http:/i, "https:");
      }
      return base;
    }

    function loadConfig() {
      const params = new URLSearchParams(location.search);
      const fromQuery = params.get("base") || params.get("api");
      el.apiBase.value = fromQuery || localStorage.getItem(STORAGE_BASE) || DEFAULT_API_BASE;
      el.apiKey.value = localStorage.getItem(STORAGE_KEY) || DEFAULT_API_KEY;
    }

    function saveConfig() {
      localStorage.setItem(STORAGE_BASE, normalizeBase(el.apiBase.value));
      localStorage.setItem(STORAGE_KEY, el.apiKey.value.trim() || DEFAULT_API_KEY);
      setStatus(el.connStatus, "配置已保存到本机", "ok");
    }

    function setStatus(node, text, kind) {
      node.textContent = text || "";
      node.className = "status" + (kind ? " " + kind : "");
    }

    async function api(path, options) {
      const base = normalizeBase(el.apiBase.value);
      if (!base) throw new Error("请先填写 API Base（形如 https://host/v1）");
      const key = el.apiKey.value.trim() || DEFAULT_API_KEY;
      const url = base + path;
      const res = await fetch(url, {
        ...options,
        headers: {
          Authorization: "Bearer " + key,
          "Content-Type": "application/json",
          ...(options && options.headers)
        }
      });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch (_) { data = { raw: text }; }
      if (!res.ok) {
        const msg = (data && (data.message || data.errorMsg || data.error || data.detail)) || text || res.statusText;
        throw new Error("HTTP " + res.status + " · " + msg);
      }
      return data;
    }

    function renderDatasets() {
      el.datasetList.innerHTML = "";
      if (!state.datasets.length) {
        el.datasetList.innerHTML = '<div class="status">暂无知识库，请先连接。</div>';
        return;
      }
      state.datasets.forEach((ds) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "dataset-item" + (state.selectedIds.has(ds.id) ? " active" : "");
        btn.innerHTML =
          "<strong></strong><small></small>";
        btn.querySelector("strong").textContent = ds.name || ds.id;
        const docs = ds.document_count != null ? ds.document_count + " 篇文档" : "";
        const words = ds.word_count != null ? " · " + ds.word_count + " 字" : "";
        btn.querySelector("small").textContent = (ds.description || "无描述") + (docs ? "\n" + docs + words : "");
        btn.addEventListener("click", () => {
          if (state.selectedIds.has(ds.id)) state.selectedIds.delete(ds.id);
          else state.selectedIds.add(ds.id);
          renderDatasets();
          updateTitle();
        });
        el.datasetList.appendChild(btn);
      });
    }

    function updateTitle() {
      const n = state.selectedIds.size;
      if (!n) {
        el.activeTitle.textContent = "财务知识问答（请选择知识库）";
        return;
      }
      const names = state.datasets
        .filter((d) => state.selectedIds.has(d.id))
        .map((d) => d.name)
        .slice(0, 2);
      const more = n > 2 ? " 等 " + n + " 个库" : n > 1 ? " 等 " + n + " 个库" : "";
      el.activeTitle.textContent = "正在检索：" + names.join("、") + (n > 1 ? more : "");
    }

    async function connect() {
      setStatus(el.connStatus, "正在连接…");
      setStatus(el.listStatus, "");
      try {
        const data = await api("/knowledge/datasets?page=1&limit=50");
        const list = Array.isArray(data && data.data) ? data.data : [];
        state.datasets = list;
        state.selectedIds = new Set(list.slice(0, 1).map((d) => d.id));
        renderDatasets();
        updateTitle();
        setStatus(el.connStatus, "已连接 · 共 " + (data.total != null ? data.total : list.length) + " 个知识库", "ok");
        setStatus(el.listStatus, list.length ? "点击可选中/取消知识库" : "接口返回空列表", list.length ? "ok" : "err");
        if (!list.length) {
          addMessage("bot", "已连通接口，但当前密钥下没有可用知识库。请在平台创建财务知识库后再试。");
        } else if (el.chat.children.length === 0) {
          addMessage(
            "bot",
            "你好，我是「财知」。已加载知识库，可直接提问财务制度、报销、核算等问题；我会检索知识库并附上来源片段。"
          );
        }
      } catch (err) {
        setStatus(el.connStatus, String(err.message || err), "err");
        setStatus(el.listStatus, "连接失败", "err");
      }
    }

    function addMessage(role, text, sources) {
      const box = document.createElement("div");
      box.className = "msg " + role;
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = role === "user" ? "你" : "财知";
      box.appendChild(who);
      box.appendChild(document.createTextNode(text));
      if (sources && sources.length) {
        const wrap = document.createElement("div");
        wrap.className = "sources";
        sources.forEach((s, i) => {
          const item = document.createElement("div");
          item.className = "source";
          const meta = document.createElement("div");
          meta.className = "meta";
          const score = s.metadata && (s.metadata.rerank_score != null ? s.metadata.rerank_score : s.metadata.score);
          meta.textContent =
            "来源 " + (i + 1) + " · " + (s.title || (s.metadata && s.metadata.document_name) || "文档") +
            (score != null ? " · score " + Number(score).toFixed(3) : "");
          item.appendChild(meta);
          item.appendChild(document.createTextNode(s.content || ""));
          wrap.appendChild(item);
        });
        box.appendChild(wrap);
      }
      el.chat.appendChild(box);
      el.chat.scrollTop = el.chat.scrollHeight;
    }

    function showTyping() {
      const t = document.createElement("div");
      t.className = "typing";
      t.id = "typing";
      t.innerHTML = "<i></i><i></i><i></i>";
      el.chat.appendChild(t);
      el.chat.scrollTop = el.chat.scrollHeight;
    }

    function hideTyping() {
      const t = document.getElementById("typing");
      if (t) t.remove();
    }

    function composeAnswer(query, results) {
      if (!results || !results.length) {
        return {
          text: "知识库中没有检索到足够相关的内容。可换个说法，或检查所选知识库是否包含对应财务制度文档。",
          sources: []
        };
      }
      const top = results.slice(0, 3);
      const bullets = top.map((r, i) => {
        const title = r.title || (r.metadata && r.metadata.document_name) || ("片段 " + (i + 1));
        const body = String(r.content || "").replace(/\s+/g, " ").trim();
        const snippet = body.length > 220 ? body.slice(0, 220) + "…" : body;
        return (i + 1) + ". 【" + title + "】" + snippet;
      });
      const text =
        "针对「" + query + "」，根据企业知识库检索结果整理如下：\n\n" +
        bullets.join("\n\n") +
        "\n\n以上内容来自已选知识库召回片段，请以正式制度原文与财务部门解释为准。";
      return { text, sources: top };
    }

    async function retrieve(query) {
      const ids = Array.from(state.selectedIds);
      if (!ids.length) throw new Error("请至少选择一个知识库");
      const method = el.method.value || "hybrid_search";
      const topK = Math.max(1, parseInt(el.topK.value, 10) || 3);
      const scoreThreshold = Number(el.threshold.value);
      const threshold = Number.isFinite(scoreThreshold) ? scoreThreshold : 0.3;

      if (ids.length === 1) {
        const data = await api("/knowledge/datasets/" + encodeURIComponent(ids[0]) + "/retrieval", {
          method: "POST",
          body: JSON.stringify({
            query,
            retrieval_method: method,
            top_k: topK,
            score_threshold: threshold
          })
        });
        return Array.isArray(data && data.result) ? data.result : [];
      }

      const qs = new URLSearchParams();
      ids.forEach((id) => qs.append("dataset_ids", id));
      qs.set("query", query);
      qs.set("retrieval_method", method);
      qs.set("top_k", String(topK));
      qs.set("score_threshold", String(threshold));
      const data = await api("/knowledge/datasets/retrieval?" + qs.toString(), { method: "GET" });
      return Array.isArray(data && data.result) ? data.result : [];
    }

    async function ask(question) {
      const q = String(question || "").trim();
      if (!q || state.busy) return;
      state.busy = true;
      el.send.disabled = true;
      addMessage("user", q);
      el.input.value = "";
      showTyping();
      try {
        const results = await retrieve(q);
        const { text, sources } = composeAnswer(q, results);
        hideTyping();
        addMessage("bot", text, sources);
      } catch (err) {
        hideTyping();
        addMessage("bot", "检索失败：" + (err.message || err));
      } finally {
        state.busy = false;
        el.send.disabled = false;
        el.input.focus();
      }
    }

    function renderChips() {
      el.chips.innerHTML = "";
      SUGGESTIONS.forEach((text) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.textContent = text;
        b.addEventListener("click", () => ask(text));
        el.chips.appendChild(b);
      });
    }

    el.btnSave.addEventListener("click", saveConfig);
    el.btnConnect.addEventListener("click", () => {
      saveConfig();
      connect();
    });
    el.form.addEventListener("submit", (e) => {
      e.preventDefault();
      ask(el.input.value);
    });

    loadConfig();
    renderChips();
    renderDatasets();
    if (normalizeBase(el.apiBase.value)) {
      connect();
    } else {
      setStatus(el.connStatus, "请填写 API Base 后点击「连接知识库」");
      addMessage(
        "bot",
        "欢迎使用「财知」。请在左侧填写知识库 API Base（以 /v1 结尾），密钥已预置，连接后即可提问。"
      );
    }
  </script>
</body>
</html>
