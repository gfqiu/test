<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>知答 · 智能问答</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2421;
      --ink-soft: #3d4a45;
      --paper: #e8f0ec;
      --mist: #c5d9cf;
      --leaf: #2f6b52;
      --leaf-deep: #1e4a38;
      --amber: #c47a2c;
      --line: rgba(26, 36, 33, 0.12);
      --bubble-user: #2f6b52;
      --bubble-bot: rgba(255, 255, 255, 0.78);
      --shadow: 0 18px 50px rgba(30, 74, 56, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Noto Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 60% at 10% 0%, #d4e8dc 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 100%, #c8ddd2 0%, transparent 50%),
        linear-gradient(165deg, #f2f7f4 0%, #dbe8e0 45%, #cfe0d6 100%);
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          -12deg,
          transparent,
          transparent 28px,
          rgba(47, 107, 82, 0.03) 28px,
          rgba(47, 107, 82, 0.03) 29px
        );
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(720px, 100%);
      margin: 0 auto;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: 1.25rem 1rem 1rem;
    }

    header {
      padding: 0.5rem 0.25rem 1rem;
      animation: rise 0.7s ease both;
    }

    .brand {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      letter-spacing: 0.06em;
      color: var(--leaf-deep);
      line-height: 1.1;
    }

    .tagline {
      margin-top: 0.45rem;
      color: var(--ink-soft);
      font-size: 0.95rem;
      max-width: 28em;
      line-height: 1.55;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      min-height: 0;
      animation: rise 0.85s 0.08s ease both;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.85rem 1rem 0.35rem;
      border-bottom: 1px solid var(--line);
    }

    .chip {
      appearance: none;
      border: 1px solid rgba(47, 107, 82, 0.28);
      background: transparent;
      color: var(--leaf-deep);
      font: inherit;
      font-size: 0.82rem;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }

    .chip:hover {
      background: var(--leaf);
      color: #fff;
      transform: translateY(-1px);
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 88%;
      padding: 0.75rem 0.95rem;
      line-height: 1.6;
      font-size: 0.95rem;
      animation: pop 0.35s ease both;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--bubble-bot);
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .msg.user {
      align-self: flex-end;
      background: var(--bubble-user);
      color: #f4faf7;
    }

    .msg .who {
      display: block;
      font-size: 0.72rem;
      opacity: 0.65;
      margin-bottom: 0.25rem;
      letter-spacing: 0.04em;
    }

    .typing {
      align-self: flex-start;
      display: flex;
      gap: 0.3rem;
      padding: 0.85rem 1rem;
      background: var(--bubble-bot);
      border: 1px solid var(--line);
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--leaf);
      animation: blink 1.1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    form {
      display: flex;
      gap: 0.55rem;
      padding: 0.85rem 1rem 1rem;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.35);
    }

    input[type="text"] {
      flex: 1;
      border: 1px solid rgba(47, 107, 82, 0.35);
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 0.95rem;
      padding: 0.75rem 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--leaf);
      box-shadow: 0 0 0 3px rgba(47, 107, 82, 0.15);
    }

    button.send {
      appearance: none;
      border: none;
      background: var(--leaf-deep);
      color: #f4faf7;
      font: inherit;
      font-weight: 500;
      padding: 0 1.15rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      white-space: nowrap;
    }

    button.send:hover { background: var(--leaf); }
    button.send:active { transform: scale(0.98); }
    button.send:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    footer {
      text-align: center;
      padding: 0.75rem 0 0.25rem;
      font-size: 0.75rem;
      color: var(--ink-soft);
      opacity: 0.75;
      animation: rise 1s 0.15s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }

    @media (max-width: 520px) {
      .app { padding: 0.85rem 0.65rem 0.75rem; }
      .msg { max-width: 94%; }
      .chips { gap: 0.4rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">知答</div>
      <p class="tagline">本地智能问答助手。输入问题，或点选下方话题，立刻获得条理清晰的回答。</p>
    </header>

    <div class="panel">
      <div class="chips" id="chips" aria-label="推荐问题"></div>
      <div class="chat" id="chat" role="log" aria-live="polite"></div>
      <form id="form" autocomplete="off">
        <input
          id="input"
          type="text"
          maxlength="500"
          placeholder="输入你的问题…"
          aria-label="问题输入框"
        />
        <button class="send" type="submit" id="send">提问</button>
      </form>
    </div>

    <footer>知答 · 纯前端本地问答 · 无需联网接口</footer>
  </div>

  <script>
    const SUGGESTIONS = [
      "你是谁？",
      "怎么使用知答？",
      "推荐学习方法",
      "什么是健康作息？",
      "如何提升专注力？",
      "讲个小笑话"
    ];

    const KB = [
      {
        keys: ["你是谁", "你叫什么", "介绍一下", "自我介绍", "是什么"],
        answer:
          "我是「知答」，一个运行在浏览器里的本地智能问答助手。\n我会根据你的问题做关键词匹配与规则推理，给出简洁可用的回答。无需账号、无需后端。"
      },
      {
        keys: ["怎么用", "如何使用", "使用方法", "怎么玩", "帮助", "help"],
        answer:
          "使用很简单：\n1. 在底部输入框写下问题；\n2. 或点击上方推荐话题快速提问；\n3. 我会匹配知识库并回复。\n试试问学习、健康、专注力，或随便聊两句。"
      },
      {
        keys: ["学习方法", "怎么学习", "高效学习", "复习", "考试"],
        answer:
          "几条实用学习方法：\n· 番茄钟：25 分钟专注 + 5 分钟休息；\n· 主动回忆：合上书本自测，比反复阅读更有效；\n· 间隔重复：今天学、明天复、一周后再复；\n· 费曼技巧：用自己的话讲给别人听。\n先选一门科目，从「主动回忆」开始最划算。"
      },
      {
        keys: ["健康", "作息", "睡眠", "早睡", "熬夜"],
        answer:
          "健康作息建议：\n· 固定起床与入睡时间，周末也尽量不差超过 1 小时；\n· 睡前 1 小时减少强光与刷短视频；\n· 白天适度走动与自然光；\n· 晚餐别太晚、别过饱。\n睡眠质量上去了，注意力和学习效率会一起提升。"
      },
      {
        keys: ["专注", "分心", "注意力", "拖延", "效率"],
        answer:
          "提升专注力可以这样做：\n· 把手机放到视线外，或开专注模式；\n· 把任务拆成「下一步就能做」的小步骤；\n· 用计时器给自己一个明确窗口；\n· 开始前写下唯一目标，避免多开任务。\n先完成 10 分钟，往往比「等到状态好」更管用。"
      },
      {
        keys: ["笑话", "搞笑", "幽默", "开心"],
        answer:
          "程序员去买菜。\n摊主：「黄瓜怎么卖？」\n程序员：「报个价就行，别问怎么卖——我只负责实现，不负责产品设计。」"
      },
      {
        keys: ["天气", "气温", "下雨"],
        answer:
          "我这边看不到实时天气数据。建议打开手机天气 App，或看看窗外——那通常比我更准。"
      },
      {
        keys: ["时间", "几点", "日期", "今天"],
        answer: () => {
          const now = new Date();
          const text = now.toLocaleString("zh-CN", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          });
          return "现在是：" + text + "。\n时间会走，问题可以慢慢问，我不赶你。"
        }
      },
      {
        keys: ["谢谢", "感谢", "多谢"],
        answer: "不客气。有问题随时再来问「知答」。"
      },
      {
        keys: ["再见", "拜拜", "走了"],
        answer: "再见。下次打开页面，我还在。"
      }
    ];

    const FALLBACKS = [
      "这个问题我还没收录进知识库。你可以换个说法，或问问学习、健康、专注力相关话题。",
      "我暂时没有足够匹配的答案。试试更具体一点，比如「如何提升专注力」。",
      "暂时答不上来。点上方推荐问题，或问「怎么使用知答」。"
    ];

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const chips = document.getElementById("chips");

    function addMessage(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = role === "user" ? "你" : "知答";
      el.appendChild(who);
      el.appendChild(document.createTextNode(text));
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    function showTyping() {
      const el = document.createElement("div");
      el.className = "typing";
      el.id = "typing";
      el.innerHTML = "<span></span><span></span><span></span>";
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById("typing");
      if (el) el.remove();
    }

    function score(question, keys) {
      const q = question.toLowerCase();
      let s = 0;
      for (const k of keys) {
        if (q.includes(k.toLowerCase())) s += k.length;
      }
      return s;
    }

    function answerOf(entry) {
      return typeof entry.answer === "function" ? entry.answer() : entry.answer;
    }

    function think(question) {
      const q = question.trim();
      if (!q) return "请先输入一个问题。";

      let best = null;
      let bestScore = 0;
      for (const item of KB) {
        const s = score(q, item.keys);
        if (s > bestScore) {
          bestScore = s;
          best = item;
        }
      }

      if (best && bestScore > 0) return answerOf(best);

      if (/你好|您好|嗨|hi|hello/i.test(q)) {
        return "你好，我是知答。想聊学习方法、健康作息，还是随便问问怎么用我？";
      }

      return FALLBACKS[Math.floor(Math.random() * FALLBACKS.length)];
    }

    async function ask(question) {
      const q = question.trim();
      if (!q) return;

      addMessage("user", q);
      input.value = "";
      send.disabled = true;
      showTyping();

      const delay = 380 + Math.random() * 420;
      await new Promise((r) => setTimeout(r, delay));

      hideTyping();
      addMessage("bot", think(q));
      send.disabled = false;
      input.focus();
    }

    SUGGESTIONS.forEach((text) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chip";
      btn.textContent = text;
      btn.addEventListener("click", () => ask(text));
      chips.appendChild(btn);
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      ask(input.value);
    });

    addMessage(
      "bot",
      "你好，我是知答。\n可以直接提问，或点选上方话题开始。例如：学习方法、健康作息、提升专注力。"
    );
    input.focus();
  </script>
</body>
</html>
